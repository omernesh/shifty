id: signup
type: PageHeaderMenu
auth:
  protected: false
properties:
  title: יצירת חשבון חדש | shifty
blocks:
  - id: signup_title
    type: Title
    properties:
      content: יצירת מערך חדש
      level: 2
  - id: tenant_name_input
    type: TextInput
    properties:
      label: שם המערך
      required: true
  - id: org_depth_select
    type: SelectInput
    properties:
      label: עומק היררכיה
      options:
        - { value: 1, label: 'שכבה אחת (קבוצה יחידה)' }
        - { value: 2, label: 'שתי שכבות (יחידה -> צוותים)' }
        - { value: 3, label: 'שלוש שכבות (יחידה -> פלוגות -> צוותים)' }
      required: true
      defaultValue: 1
  - id: email_input
    type: TextInput
    properties:
      label: כתובת אימייל של מנהל המערך
      required: true
      validate:
        - type: email
          message: כתובת אימייל לא תקפה
  - id: display_name_input
    type: TextInput
    properties:
      label: שמך המלא
      required: true
  - id: create_button
    type: Button
    properties:
      title: 'צור מערך ושלח קישור כניסה'
    events:
      onClick:
        - id: create_tenant
          type: Request
          params:
            requestId: bootstrap_tenant
        - id: signin_after
          type: Login
          params:
            providerId: email
            email:
              _state: email_input
            callbackUrl: /admin_dashboard
requests:
  - id: bootstrap_tenant
    type: KnexRaw
    connectionId: shifts_db
    payload:
      tenant_name:
        _state: tenant_name_input
      org_depth:
        _state: org_depth_select
      email:
        _state: email_input
      display_name:
        _state: display_name_input
    properties:
      query: |
        -- @gsd-allow-untenanted: founding-admin signup, no tenant context exists yet;
        --                        inline set_config elevates transaction to new tenant context after INSERT.
        WITH new_tenant AS (
          INSERT INTO tenant (name, org_depth)
          VALUES (:tenant_name, :org_depth)
          RETURNING id
        ),
        set_tenant_ctx AS (
          SELECT set_config('app.current_tenant', id::text, true) FROM new_tenant
        ),
        new_org_unit AS (
          INSERT INTO org_unit (tenant_id, parent_id, level, name)
          SELECT id, NULL, 1, :tenant_name FROM new_tenant
          RETURNING id, tenant_id
        ),
        new_user AS (
          INSERT INTO app_user (tenant_id, email, display_name, locale)
          SELECT tenant_id, :email, :display_name, 'he' FROM new_org_unit
          RETURNING id, tenant_id
        ),
        new_soldier AS (
          INSERT INTO soldier (tenant_id, user_id, display_name)
          SELECT nu.tenant_id, nu.id, :display_name FROM new_user nu
          RETURNING id, tenant_id
        )
        INSERT INTO membership (tenant_id, soldier_id, org_unit_id, role)
        SELECT ns.tenant_id, ns.id, nou.id, 'unit_admin'
        FROM new_soldier ns, new_org_unit nou
        RETURNING tenant_id;
      parameters:
        tenant_name: { _payload: tenant_name }
        org_depth: { _payload: org_depth }
        email: { _payload: email }
        display_name: { _payload: display_name }

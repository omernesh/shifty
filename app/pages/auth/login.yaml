id: login
type: PageHeaderMenu
auth:
  protected: false
properties:
  title: Sign in | shifty
blocks:
  - id: signin_title
    type: Title
    properties:
      content: כניסה לחשבון
      level: 2
  - id: email_input
    type: TextInput
    properties:
      label: כתובת אימייל
      placeholder: you@example.com
      required: true
      validate:
        - type: email
          message: כתובת אימייל לא תקפה
  - id: signin_button
    type: Button
    properties:
      title: שלח קישור כניסה
    events:
      onClick:
        - id: do_signin
          type: Login
          params:
            providerId: email
            email:
              _state: email_input
            callbackUrl: /signup_with_invite
  - id: signup_link
    type: Paragraph
    properties:
      content: 'אין לך חשבון? [צור חשבון חדש](/signup)'

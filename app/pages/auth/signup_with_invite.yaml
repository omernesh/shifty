id: signup_with_invite
type: PageCenteredHero
auth:
  protected: false
properties:
  title: הרשמה עם קוד הזמנה | shifty
blocks:
  - id: title
    type: Title
    properties:
      content: הרשמה עם קוד הזמנה
      level: 2
  - id: email_input
    type: TextInput
    properties:
      label: כתובת אימייל
      required: true
      validate:
        - type: email
          message: כתובת אימייל לא תקפה
  - id: code_input
    type: TextInput
    properties:
      label: 'קוד הזמנה (8 תווים)'
      required: true
  - id: display_name_input
    type: TextInput
    properties:
      label: שמך המלא
      required: true
  - id: error_banner
    type: Paragraph
    properties:
      content:
        _state: error_message
      style:
        color: red
    visible:
      _state: error_message
  - id: submit_button
    type: Button
    properties:
      title: הירשם
    events:
      onClick:
        - id: do_redeem
          type: Request
          params:
            requestId: redeem_invite
          onError:
            - id: set_error
              type: SetState
              params:
                error_message: 'קוד הזמנה לא תקף או פג תוקף'
        - id: signin_after
          type: SignIn
          params:
            providerId: email
            email:
              _state: email_input
            callbackUrl: /my_dashboard
requests:
  - id: redeem_invite
    type: KnexRaw
    connectionId: shifts_db
    payload:
      code:
        _state: code_input
      email:
        _state: email_input
      display_name:
        _state: display_name_input
    properties:
      query: |
        -- @gsd-allow-untenanted: invite-code lookup runs before tenant context is established;
        --                        lookup_invite_code is SECURITY DEFINER (bypasses RLS);
        --                        inline set_config elevates transaction to looked-up tenant context.
        DO $$
        DECLARE _tenant uuid;
        BEGIN
          SELECT tenant_id INTO _tenant FROM lookup_invite_code(:code) LIMIT 1;
          IF _tenant IS NULL THEN
            RAISE EXCEPTION 'invite_code_invalid';
          END IF;
          PERFORM set_config('app.current_tenant', _tenant::text, true);
        END $$;

        WITH inv AS (SELECT * FROM lookup_invite_code(:code)),
        upserted_user AS (
          INSERT INTO app_user (tenant_id, email, display_name, locale)
          SELECT tenant_id, :email, :display_name, 'he' FROM inv
          ON CONFLICT (tenant_id, email) DO UPDATE SET updated_at = now()
          RETURNING id, tenant_id
        ),
        upserted_soldier AS (
          INSERT INTO soldier (tenant_id, user_id, display_name)
          SELECT uu.tenant_id, uu.id, :display_name FROM upserted_user uu
          ON CONFLICT DO NOTHING
          RETURNING id, tenant_id
        ),
        target_soldier AS (
          SELECT s.id, s.tenant_id FROM soldier s, upserted_user uu
          WHERE s.user_id = uu.id
          LIMIT 1
        ),
        membership_insert AS (
          INSERT INTO membership (tenant_id, soldier_id, org_unit_id, role)
          SELECT ts.tenant_id, ts.id, inv.org_unit_id, inv.role
          FROM target_soldier ts, inv
          ON CONFLICT (soldier_id, org_unit_id) DO NOTHING
          RETURNING tenant_id
        ),
        code_update AS (
          UPDATE invite_code SET uses = uses + 1
          WHERE id = (SELECT id FROM inv)
          RETURNING id
        )
        INSERT INTO invite_code_redemption (tenant_id, invite_code_id, user_id)
        SELECT uu.tenant_id, inv.id, uu.id FROM upserted_user uu, inv
        RETURNING tenant_id;
      parameters:
        code: { _payload: code }
        email: { _payload: email }
        display_name: { _payload: display_name }

id: my_availability
type: PageHeaderMenu
properties:
  title: 'הזמינות שלי | shifty'

# Plan 03-05 Task 2 — soldier-facing availability declaration page
# (UI-SPEC Surface 8 self-view + Surface 9 manager-override view).
#
# URL: /my_availability?planning_window_id=<uuid>&soldier_id=<uuid?>
#   - Self-view:           /my_availability?planning_window_id=<pw>
#                          (soldier_id derived inside handlers from session)
#   - Manager-override:    /my_availability?planning_window_id=<pw>&soldier_id=<s>
#                          (caller must have unit_admin or team_manager role; the
#                          handler-side Layer-4 scope check enforces "manager of
#                          target's team")
#
# Note: Lowdefy 5.3 routes pages by their YAML `id:` verbatim — the file's
# location under `pages/` is a filesystem convention only. The `:planning_window_id`
# path segment described in UI-SPEC is implemented via URL query (`?planning_window_id=`)
# because Lowdefy 5.3 does not support path-segment parameters at the page level;
# all parameterized state is `_url_query` derived (same shape as team_detail's
# `?id=` and soldier_detail's `?id=`). DEVIATION [Rule 3]: documented because the
# UI-SPEC §"Routing" notation `/{planning_window_id}` suggested path params; the
# behavior is identical from the soldier's perspective (the URL is bookmarkable
# and shareable; the page derives state from the query string).
#
# 4-layer tenant isolation:
#   Layer 1 (session):  tenant_id sourced from `_user: tenant_id` in every payload.
#   Layer 2 (query):    every KnexRawTenant query filters by WHERE tenant_id = :tenant_id.
#   Layer 3 (page):     auth.roles allowlist includes member + team_manager + unit_admin
#                       (every authenticated role can reach the page; manager-override
#                       behavior is gated server-side by the handler).
#   Layer 4 (handler):  DeclareAvailability — tenant_id from session, soldier_id derived
#                       from session for self modes; manager_override does a membership
#                       scope check on the target soldier's team.
#   Layer 5 (RLS):      0009 + 0014 RLS policies on availability + shift_instance.

requests:
  # ── load_planning_window ────────────────────────────────────────────────────
  # Reads the window's metadata for the title / lock status / range bounds.
  - id: load_planning_window
    type: KnexRawTenant
    connectionId: shifts_db
    payload:
      tenant_id:
        _user: tenant_id
      pw_id:
        _url_query: planning_window_id
    properties:
      query: |
        SELECT id,
               team_id,
               start_date,
               end_date,
               state,
               constraint_lock_at,
               (constraint_lock_at <= now()) AS is_locked
          FROM planning_window
         WHERE id = :pw_id
           AND tenant_id = :tenant_id
      parameters:
        tenant_id: { _payload: tenant_id }
        pw_id: { _payload: pw_id }

  # ── load_target_soldier ─────────────────────────────────────────────────────
  # In self-view: returns the actor's own soldier row (via _user: soldier_id).
  # In manager-override view: returns the URL-param soldier (Layer 5 RLS guards
  # cross-tenant; the manager-of-team scope check happens at the handler).
  - id: load_target_soldier
    type: KnexRawTenant
    connectionId: shifts_db
    payload:
      tenant_id:
        _user: tenant_id
      target_soldier_id:
        _if:
          test: { _url_query: soldier_id }
          then: { _url_query: soldier_id }
          else: { _user: soldier_id }
    properties:
      query: |
        SELECT id, display_name, color
          FROM soldier
         WHERE tenant_id = :tenant_id
           AND id = :target_soldier_id::uuid
      parameters:
        tenant_id: { _payload: tenant_id }
        target_soldier_id: { _payload: target_soldier_id }

  # ── load_availability ───────────────────────────────────────────────────────
  # Source-precedence LATERAL read query (RESEARCH §"Recipe 6"). Returns one row
  # per shift_instance with the effective declared+source (manager_override > per_slot
  # > range_blockout > default). The CASE rank ordering MUST match SOURCE_RANK in
  # helpers/availability-source.js — asserted by the drift-detection meta-test in
  # tests/integration/availability-source-precedence.spec.ts (Risk R-03-3).
  - id: load_availability
    type: KnexRawTenant
    connectionId: shifts_db
    payload:
      tenant_id:
        _user: tenant_id
      target_soldier_id:
        _if:
          test: { _url_query: soldier_id }
          then: { _url_query: soldier_id }
          else: { _user: soldier_id }
      pw_id:
        _url_query: planning_window_id
    properties:
      query: |
        SELECT
          si.id                                AS shift_instance_id,
          si.date::text                        AS date,
          si.headcount_index,
          ss.id                                AS shift_slot_id,
          ss.name                              AS slot_name,
          ss.start_time::text                  AS start_time,
          ss.end_time::text                    AS end_time,
          COALESCE(av.declared, 'available')   AS declared,
          COALESCE(av.source, 'default')       AS source,
          av.id                                AS availability_id
        FROM shift_instance si
        JOIN shift_slot ss
          ON ss.id = si.shift_slot_id
         AND ss.tenant_id = si.tenant_id
        LEFT JOIN LATERAL (
          SELECT id, declared, source
            FROM availability a
           WHERE a.shift_instance_id = si.id
             AND a.soldier_id = :target_soldier_id::uuid
             AND a.tenant_id = :tenant_id
           ORDER BY CASE a.source
             WHEN 'manager_override' THEN 3
             WHEN 'per_slot' THEN 2
             WHEN 'range_blockout' THEN 1
             ELSE 0
           END DESC
           LIMIT 1
        ) av ON true
        WHERE si.tenant_id = :tenant_id
          AND si.planning_window_id = :pw_id
        ORDER BY si.date, ss.display_order, si.headcount_index
      parameters:
        tenant_id: { _payload: tenant_id }
        target_soldier_id: { _payload: target_soldier_id }
        pw_id: { _payload: pw_id }

  # ── declare_range_blockout ──────────────────────────────────────────────────
  # Fires DeclareAvailability mode='range_blockout'. tenant_id + soldier_id are
  # derived inside the handler from the session (NEVER from payload here, even
  # though we have them available — defense-in-depth).
  - id: declare_range_blockout
    type: DeclareAvailability
    connectionId: shifts_db
    payload:
      planning_window_id: { _url_query: planning_window_id }
      mode: range_blockout
      range_from: { _state: range_form.range_from }
      range_to: { _state: range_form.range_to }

  # ── declare_per_slot ────────────────────────────────────────────────────────
  # Per-slot Switch onChange fires this. shift_instance_id + declared come from
  # the Switch event context (set by availability_date_row).
  - id: declare_per_slot
    type: DeclareAvailability
    connectionId: shifts_db
    payload:
      planning_window_id: { _url_query: planning_window_id }
      mode: per_slot_toggle
      shift_instance_id: { _state: pending_toggle.shift_instance_id }
      declared: { _state: pending_toggle.declared }

  # ── declare_manager_override ────────────────────────────────────────────────
  # Same payload shape as per_slot but mode='manager_override' + soldier_id from URL.
  # Fires only in manager-override view (gated by Switch visible: state).
  - id: declare_manager_override
    type: DeclareAvailability
    connectionId: shifts_db
    payload:
      planning_window_id: { _url_query: planning_window_id }
      mode: manager_override
      soldier_id: { _url_query: soldier_id }
      shift_instance_id: { _state: pending_toggle.shift_instance_id }
      declared: { _state: pending_toggle.declared }

blocks:
  # ── Page title ──────────────────────────────────────────────────────────────
  # Self-view: 'הזמינות שלי'.
  # Manager-override: 'הזמינות של {display_name} – {window_label}'.
  - id: page_title
    type: Title
    properties:
      content:
        _if:
          test: { _url_query: soldier_id }
          then:
            _nunjucks:
              template: 'הזמינות של {{ name }} – {{ s }} עד {{ e }}'
              on:
                name: { _request: load_target_soldier.0.display_name }
                s: { _request: load_planning_window.0.start_date }
                e: { _request: load_planning_window.0.end_date }
          else: 'הזמינות שלי'
      level: 1

  # ── Manager-mode banner (UI-SPEC Surface 9) ─────────────────────────────────
  # Persistent warning Alert at top of page when manager-override mode is active.
  # Visible only when soldier_id URL param is set.
  - id: manager_override_banner
    type: Alert
    visible:
      _url_query: soldier_id
    properties:
      type: warning
      showIcon: true
      message:
        _nunjucks:
          template: 'אתה עורך את הזמינות של {{ name }} כמנהל. כל שינוי ייכתב כ-manager_override ויתועד.'
          on:
            name: { _request: load_target_soldier.0.display_name }
      style:
        marginBottom: 16

  # ── Lock state Alert (self-view + locked) ──────────────────────────────────
  # Visible only in self-view AND when the window is past constraint_lock_at.
  # Manager-mode bypasses lock (and shows the manager banner instead).
  - id: lock_alert
    type: Alert
    visible:
      _and:
        - _not: { _url_query: soldier_id }
        - { _request: load_planning_window.0.is_locked }
    properties:
      type: error
      showIcon: true
      message: 'החלון נעול — לא ניתן לערוך עד תום החלון'
      style:
        marginBottom: 16

  # ── Range-blockout card (UI-SPEC Surface 8 top) ─────────────────────────────
  # Soldier marks themselves unavailable across a continuous date range.
  # Mobile-first vertical layout. Inputs are disabled in self-view + locked state.
  - id: range_blockout_card
    type: Card
    properties:
      title: סימון אי-זמינות בטווח
      style:
        marginBottom: 24
    blocks:
      - id: range_form.range_from
        type: DateSelector
        required: true
        properties:
          label: מתאריך
          picker: date
          format: DD/MM/YYYY
          size: large
          disabled:
            _and:
              - _not: { _url_query: soldier_id }
              - { _request: load_planning_window.0.is_locked }
          style:
            width: '100%'
            minHeight: 48
            marginBottom: 12

      - id: range_form.range_to
        type: DateSelector
        required: true
        properties:
          label: עד תאריך
          picker: date
          format: DD/MM/YYYY
          size: large
          disabled:
            _and:
              - _not: { _url_query: soldier_id }
              - { _request: load_planning_window.0.is_locked }
          style:
            width: '100%'
            minHeight: 48
            marginBottom: 12

      - id: range_blockout_submit_btn
        type: Button
        properties:
          # i18n: my_availability.range_submit
          title: 'סמן כלא זמין בטווח'
          type: primary
          size: large
          block: true
          icon: AiOutlineCalendar
          disabled:
            _or:
              - _not: { _state: range_form.range_from }
              - _not: { _state: range_form.range_to }
              - _lt:
                  - { _state: range_form.range_to }
                  - { _state: range_form.range_from }
              - _and:
                  - _not: { _url_query: soldier_id }
                  - { _request: load_planning_window.0.is_locked }
        events:
          onClick:
            - id: do_range_blockout
              type: Request
              params:
                requestId: declare_range_blockout
            - id: refresh_availability_after_range
              type: Request
              params:
                requestId: load_availability
            - id: range_blockout_toast
              type: DisplayMessage
              params:
                status: success
                content: נשמר
                duration: 2
            - id: reset_range_form
              type: Reset
              params: range_form.range_from

  # ── Per-date list (UI-SPEC Surface 8 bottom) ────────────────────────────────
  # Lowdefy 5.3 does not have a `groupBy` operator and `_repeat` over a single
  # flat list cannot collapse per-date groups directly. We render one row PER
  # shift_instance row from load_availability — every instance is shown,
  # expandable via SetState toggle to reveal its Switch. The visual grouping
  # by date is achieved through the date+slot sort order in the SQL (ORDER BY
  # si.date, ss.display_order, si.headcount_index) plus a date-change header
  # rendered by the row block itself.
  #
  # DEVIATION [Rule 3]: the plan narrative described per-date expandable rows
  # with grouped slots inside. Lowdefy 5.3 lacks the operator surface to group
  # an array in YAML (no _groupBy / _reduce). Without server-side grouping the
  # cleanest fit is: each shift_instance row is its own visible row in the list;
  # the row block decides whether to render the date header (when the date
  # differs from the previous row's date — passed via `$.previous_date`). This
  # preserves the mobile-first layout (48×48 targets, no horizontal scroll) and
  # the per-slot Switch contract; the only behavioral difference vs the wireframe
  # is that all slots are visible by default rather than collapsed under a
  # chevron. The chevron-based expand pattern would require either an AgGrid
  # master-detail (Enterprise-only) or a Lowdefy custom block — out of scope for
  # this plan.
  - id: per_date_list
    type: List
    properties:
      items:
        _request: load_availability
    blocks:
      - _ref:
          path: blocks/availability_date_row.yaml

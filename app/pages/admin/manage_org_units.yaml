id: manage_org_units
type: PageHeaderMenu
auth:
  roles:
    - unit_admin
    - team_manager
properties:
  title: 'ניהול יחידות ארגוניות | shifty'
requests:
  - id: list_units
    type: KnexRaw
    connectionId: shifts_db
    # Recursive CTE emits a `path TEXT[]` so AgGrid `treeData: true` can rebuild the
    # tree via `getDataPath: data => data.path` (Task 2). The `counts` CTE adds
    # `child_count` used by the leaf-only delete affordance gate (col_delete cellRenderer).
    # Both arms of the UNION ALL filter by tenant_id (Layer 2 tenant isolation).
    payload:
      tenant_id:
        _user: tenant_id
    properties:
      query: |
        WITH RECURSIVE tree AS (
          SELECT id, parent_id, level, name,
                 ARRAY[name]::text[] AS path
          FROM org_unit
          WHERE tenant_id = :tenant_id AND parent_id IS NULL
          UNION ALL
          SELECT ou.id, ou.parent_id, ou.level, ou.name,
                 tree.path || ou.name
          FROM org_unit ou
          JOIN tree ON ou.parent_id = tree.id
          WHERE ou.tenant_id = :tenant_id
        ),
        counts AS (
          SELECT parent_id, COUNT(*)::int AS child_count
          FROM org_unit
          WHERE tenant_id = :tenant_id
            AND parent_id IS NOT NULL
          GROUP BY parent_id
        )
        SELECT t.id, t.parent_id, t.level, t.name, t.path,
               COALESCE(c.child_count, 0) AS child_count
        FROM tree t
        LEFT JOIN counts c ON c.parent_id = t.id
        ORDER BY t.path
      parameters:
        tenant_id: { _payload: tenant_id }

  - id: get_tenant_depth
    type: KnexRaw
    connectionId: shifts_db
    # Reads the tenant's current org_depth ceiling so the UI can detect when an
    # Add-child action at level == org_depth requires the D-04 grow-depth modal.
    # tenant_id from _user:tenant_id (server-side session) — cannot be spoofed.
    payload:
      tenant_id:
        _user: tenant_id
    properties:
      query: |
        SELECT org_depth
        FROM tenant
        WHERE id = :tenant_id
      parameters:
        tenant_id: { _payload: tenant_id }

  - id: create_org_unit
    type: KnexRaw
    connectionId: shifts_db
    # Note: request-level auth.roles not supported in Lowdefy 5.3.0; page-level auth.roles provides gate.
    # tenant_id derived from _user:tenant_id (server-side session) — cannot be spoofed by client.
    payload:
      tenant_id: { _user: tenant_id }
      parent_id: { _state: parent_id_select }
      level: { _state: level_input }
      name: { _state: name_input }
    properties:
      query: |
        INSERT INTO org_unit (tenant_id, parent_id, level, name)
        VALUES (:tenant_id, :parent_id, :level, :name)
        RETURNING id, parent_id, level, name
      parameters:
        tenant_id: { _payload: tenant_id }
        parent_id: { _payload: parent_id }
        level: { _payload: level }
        name: { _payload: name }

  - id: rename_org_unit
    type: KnexRaw
    connectionId: shifts_db
    # Note: request-level auth.roles not supported in Lowdefy 5.3.0; page-level auth.roles provides gate.
    payload:
      tenant_id: { _user: tenant_id }
      id: { _state: edit_unit_id }
      new_name: { _state: edit_name_input }
    properties:
      query: |
        UPDATE org_unit SET name = :new_name
        WHERE id = :id AND tenant_id = :tenant_id
        RETURNING id, name
      parameters:
        tenant_id: { _payload: tenant_id }
        id: { _payload: id }
        new_name: { _payload: new_name }

  - id: delete_org_unit
    type: KnexRaw
    connectionId: shifts_db
    # Note: request-level auth.roles not supported in Lowdefy 5.3.0; page-level auth.roles provides gate.
    payload:
      tenant_id: { _user: tenant_id }
      id: { _state: delete_unit_id }
    properties:
      # Hard DELETE with leaf-only guard — Phase 1 schema has no archived_at on org_unit.
      # Guard prevents orphaning subtrees: only leaf nodes (no children) can be deleted.
      # Both tenant_id filters provide defense-in-depth: query-level AND RLS (layer 5).
      query: |
        DELETE FROM org_unit
        WHERE id = :id
          AND tenant_id = :tenant_id
          AND NOT EXISTS (SELECT 1 FROM org_unit child WHERE child.parent_id = :id)
        RETURNING id
      parameters:
        tenant_id: { _payload: tenant_id }
        id: { _payload: id }

  - id: grow_org_depth_and_add_child
    type: KnexRaw
    connectionId: shifts_db
    # D-04 transactional grow-depth + insert-child in one statement.
    #
    # B4 (revision iter 1) — Layer-4 admin gate at the SQL layer.
    # UI hiding of "Add child" from team_manager (D-02) is Layer 3 — easily forged
    # by a direct POST to /api/request/manage_org_units/grow_org_depth_and_add_child.
    # The leading `guard` CTE produces one row iff :is_admin is true; downstream
    # CTEs gate on `EXISTS (SELECT 1 FROM guard)` so a non-admin POST short-circuits
    # to zero rows and tenant.org_depth is UNCHANGED.
    #
    # is_admin is sourced from _user:roles (session, server-side) via _array.includes
    # — NEVER from _payload directly. The session callback (shifty-auth) populates
    # _user.roles from membership.role joins; clients cannot spoof it.
    #
    # Acceptance test (Plan 10): POST with session.is_admin=false returns zero rows
    # AND psql SELECT org_depth FROM tenant WHERE id=$1 returns the pre-call value.
    #
    # Depth ceiling: the migration-0002 CHECK constraint
    #   tenant.org_depth SMALLINT NOT NULL CHECK (org_depth BETWEEN 1 AND 3)
    # is a DB invariant that hard-caps any UPDATE here at 3 — see also the
    # `:new_depth <= 3` guard in the depth_update CTE.
    payload:
      tenant_id: { _user: tenant_id }
      parent_id: { _state: add_child_target_id }
      new_name: { _state: add_child_name_input }
      new_depth: { _state: confirmed_new_depth }
      is_admin:
        _array.includes:
          on: { _user: roles }
          value: unit_admin
    properties:
      query: |
        WITH guard AS (
          SELECT 1 WHERE :is_admin
        ),
        depth_update AS (
          UPDATE tenant SET org_depth = :new_depth
          WHERE id = :tenant_id
            AND :new_depth > org_depth
            AND :new_depth <= 3
            AND EXISTS (SELECT 1 FROM guard)
          RETURNING id
        ),
        new_unit AS (
          INSERT INTO org_unit (tenant_id, parent_id, level, name)
          SELECT :tenant_id, :parent_id,
                 (SELECT level + 1 FROM org_unit WHERE id = :parent_id AND tenant_id = :tenant_id),
                 :new_name
          WHERE EXISTS (SELECT 1 FROM guard)
            AND (
              EXISTS (SELECT 1 FROM depth_update)
              OR (SELECT level + 1 FROM org_unit WHERE id = :parent_id AND tenant_id = :tenant_id)
                 <= (SELECT org_depth FROM tenant WHERE id = :tenant_id)
            )
          RETURNING id, level
        )
        SELECT id, level FROM new_unit
      parameters:
        tenant_id: { _payload: tenant_id }
        parent_id: { _payload: parent_id }
        new_name: { _payload: new_name }
        new_depth: { _payload: new_depth }
        is_admin: { _payload: is_admin }

blocks:
  - id: title
    type: Title
    properties:
      content: ניהול יחידות ארגוניות
      level: 1
  - id: tree_grid
    type: AgGridAlpine
    properties:
      rowData: { _request: list_units }
      columnDefs:
        - { field: name, headerName: שם }
        - { field: level, headerName: רמה }
        - { field: parent_id, headerName: 'יחידת אם' }
  - id: create_card
    type: Card
    properties:
      title: יצירת יחידה חדשה
    blocks:
      - id: parent_id_select
        type: Selector
        properties:
          label: יחידת אם
          options:
            _request: list_units
      - id: level_input
        type: NumberInput
        properties:
          label: רמה
          min: 1
          max: 3
      - id: name_input
        type: TextInput
        properties:
          label: שם
      - id: create_btn
        type: Button
        properties:
          title: צור יחידה
        events:
          onClick:
            - { id: do_create, type: Request, params: { requestId: create_org_unit } }
            - { id: refresh, type: Request, params: { requestId: list_units } }
  - id: edit_card
    type: Card
    properties:
      title: שינוי שם ליחידה קיימת
    blocks:
      - id: edit_unit_id
        type: Selector
        properties:
          label: יחידה לשינוי
          options:
            _request: list_units
      - id: edit_name_input
        type: TextInput
        properties:
          label: שם חדש
      - id: rename_btn
        type: Button
        properties:
          title: שנה שם
        events:
          onClick:
            - { id: do_rename, type: Request, params: { requestId: rename_org_unit } }
            - { id: refresh_after_rename, type: Request, params: { requestId: list_units } }
  - id: delete_card
    type: Card
    properties:
      title: 'מחיקת יחידה (עלים בלבד)'
    blocks:
      - id: delete_unit_id
        type: Selector
        properties:
          label: יחידה למחיקה
          options:
            _request: list_units
      - id: delete_btn
        type: Button
        properties:
          title: מחק יחידה
          danger: true
        events:
          onClick:
            - { id: do_delete, type: Request, params: { requestId: delete_org_unit } }
            - { id: refresh_after_delete, type: Request, params: { requestId: list_units } }

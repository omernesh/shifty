id: manage_org_units
type: PageHeaderMenu
auth:
  roles:
    - unit_admin
    - team_manager
properties:
  title: 'ניהול יחידות ארגוניות | shifty'
requests:
  - id: list_units
    type: KnexRaw
    connectionId: shifts_db
    # Recursive CTE emits a `path TEXT[]` so AgGrid `treeData: true` can rebuild the
    # tree via `getDataPath: data => data.path`. The `counts` CTE adds `child_count`
    # used by the leaf-only delete affordance gate (col_delete cellRenderer).
    # Both arms of the UNION ALL filter by tenant_id (Layer 2 tenant isolation).
    payload:
      tenant_id:
        _user: tenant_id
    properties:
      query: |
        WITH RECURSIVE tree AS (
          SELECT id, parent_id, level, name,
                 ARRAY[name]::text[] AS path
          FROM org_unit
          WHERE tenant_id = :tenant_id AND parent_id IS NULL
          UNION ALL
          SELECT ou.id, ou.parent_id, ou.level, ou.name,
                 tree.path || ou.name
          FROM org_unit ou
          JOIN tree ON ou.parent_id = tree.id
          WHERE ou.tenant_id = :tenant_id
        ),
        counts AS (
          SELECT parent_id, COUNT(*)::int AS child_count
          FROM org_unit
          WHERE tenant_id = :tenant_id
            AND parent_id IS NOT NULL
          GROUP BY parent_id
        )
        SELECT t.id, t.parent_id, t.level, t.name, t.path,
               COALESCE(c.child_count, 0) AS child_count
        FROM tree t
        LEFT JOIN counts c ON c.parent_id = t.id
        ORDER BY t.path
      parameters:
        tenant_id: { _payload: tenant_id }

  - id: get_tenant_depth
    type: KnexRaw
    connectionId: shifts_db
    # Reads the tenant's current org_depth ceiling so the UI can detect when
    # an Add-child action at level == org_depth requires the D-04 grow-depth modal.
    # tenant_id from _user:tenant_id (server-side session) — cannot be spoofed.
    payload:
      tenant_id:
        _user: tenant_id
    properties:
      query: |
        SELECT org_depth
        FROM tenant
        WHERE id = :tenant_id
      parameters:
        tenant_id: { _payload: tenant_id }

  - id: create_org_unit
    type: KnexRaw
    connectionId: shifts_db
    # Note: request-level auth.roles not supported in Lowdefy 5.3.0; page-level auth.roles provides gate.
    # tenant_id derived from _user:tenant_id (server-side session) — cannot be spoofed by client.
    payload:
      tenant_id: { _user: tenant_id }
      parent_id: { _state: parent_id_select }
      level: { _state: level_input }
      name: { _state: name_input }
    properties:
      query: |
        INSERT INTO org_unit (tenant_id, parent_id, level, name)
        VALUES (:tenant_id, :parent_id, :level, :name)
        RETURNING id, parent_id, level, name
      parameters:
        tenant_id: { _payload: tenant_id }
        parent_id: { _payload: parent_id }
        level: { _payload: level }
        name: { _payload: name }

  - id: rename_org_unit
    type: KnexRaw
    connectionId: shifts_db
    # Note: request-level auth.roles not supported in Lowdefy 5.3.0; page-level auth.roles provides gate.
    payload:
      tenant_id: { _user: tenant_id }
      id: { _state: edit_unit_id }
      new_name: { _state: edit_name_input }
    properties:
      query: |
        UPDATE org_unit SET name = :new_name
        WHERE id = :id AND tenant_id = :tenant_id
        RETURNING id, name
      parameters:
        tenant_id: { _payload: tenant_id }
        id: { _payload: id }
        new_name: { _payload: new_name }

  - id: delete_org_unit
    type: KnexRaw
    connectionId: shifts_db
    # Note: request-level auth.roles not supported in Lowdefy 5.3.0; page-level auth.roles provides gate.
    payload:
      tenant_id: { _user: tenant_id }
      id: { _state: delete_unit_id }
    properties:
      # Hard DELETE with leaf-only guard — Phase 1 schema has no archived_at on org_unit.
      # Guard prevents orphaning subtrees: only leaf nodes (no children) can be deleted.
      # Both tenant_id filters provide defense-in-depth: query-level AND RLS (layer 5).
      query: |
        DELETE FROM org_unit
        WHERE id = :id
          AND tenant_id = :tenant_id
          AND NOT EXISTS (SELECT 1 FROM org_unit child WHERE child.parent_id = :id)
        RETURNING id
      parameters:
        tenant_id: { _payload: tenant_id }
        id: { _payload: id }

  - id: grow_org_depth_and_add_child
    type: KnexRaw
    connectionId: shifts_db
    # D-04 transactional grow-depth + insert-child in one statement.
    #
    # B4 (revision iter 1) — Layer-4 admin gate at the SQL layer.
    # UI hiding of "Add child" from team_manager (D-02) is Layer 3 — easily forged
    # by a direct POST to /api/request/manage_org_units/grow_org_depth_and_add_child.
    # The leading `guard` CTE produces one row iff :is_admin is true; downstream
    # CTEs gate on `EXISTS (SELECT 1 FROM guard)` so a non-admin POST short-circuits
    # to zero rows and tenant.org_depth is UNCHANGED.
    #
    # is_admin is sourced from _user:roles (session, server-side) via _array.includes
    # — NEVER from _payload directly. The session callback (shifty-auth) populates
    # _user.roles from membership.role joins; clients cannot spoof it.
    #
    # Acceptance test (Plan 10): POST with session.is_admin=false returns zero rows
    # AND psql SELECT org_depth FROM tenant WHERE id=$1 returns the pre-call value.
    #
    # Depth ceiling: the migration-0002 CHECK constraint
    #   tenant.org_depth SMALLINT NOT NULL CHECK (org_depth BETWEEN 1 AND 3)
    # is a DB invariant that hard-caps any UPDATE here at 3 — see also the
    # `:new_depth <= 3` guard in the depth_update CTE.
    payload:
      tenant_id: { _user: tenant_id }
      parent_id: { _state: add_child_target_id }
      new_name: { _state: add_child_name_input }
      new_depth: { _state: confirmed_new_depth }
      is_admin:
        _array.includes:
          on: { _user: roles }
          value: unit_admin
    properties:
      query: |
        WITH guard AS (
          SELECT 1 WHERE :is_admin
        ),
        depth_update AS (
          UPDATE tenant SET org_depth = :new_depth
          WHERE id = :tenant_id
            AND :new_depth > org_depth
            AND :new_depth <= 3
            AND EXISTS (SELECT 1 FROM guard)
          RETURNING id
        ),
        new_unit AS (
          INSERT INTO org_unit (tenant_id, parent_id, level, name)
          SELECT :tenant_id, :parent_id,
                 (SELECT level + 1 FROM org_unit WHERE id = :parent_id AND tenant_id = :tenant_id),
                 :new_name
          WHERE EXISTS (SELECT 1 FROM guard)
            AND (
              EXISTS (SELECT 1 FROM depth_update)
              OR (SELECT level + 1 FROM org_unit WHERE id = :parent_id AND tenant_id = :tenant_id)
                 <= (SELECT org_depth FROM tenant WHERE id = :tenant_id)
            )
          RETURNING id, level
        )
        SELECT id, level FROM new_unit
      parameters:
        tenant_id: { _payload: tenant_id }
        parent_id: { _payload: parent_id }
        new_name: { _payload: new_name }
        new_depth: { _payload: new_depth }
        is_admin: { _payload: is_admin }

blocks:
  - id: title
    type: Title
    properties:
      content: ניהול יחידות ארגוניות
      level: 1

  - id: tree_grid
    type: AgGridAlpine
    # D-01 tree-table upgrade. enableRtl corrects the Phase-1 oversight (D-02).
    #
    # W6 (revision iter 1) — PURE Pattern A from RESEARCH P9: three SEPARATE action
    # columns (col_add_child, col_rename, col_delete), each rendering ONE icon-button
    # cellRenderer. Dispatch via onCellClicked branching purely on _event.column.field.
    # NO HTML data attribute bridge — Lowdefy cannot reliably hook click events on
    # nunjucks-rendered HTML spans. The column-dispatch pattern is documented in
    # skill reference/05-blocks-data.md (line 107: onCellClicked { data, value, column.field }).
    properties:
      enableRtl: true
      treeData: true
      animateRows: true
      groupDefaultExpanded: -1
      rowData: { _request: list_units }
      autoGroupColumnDef:
        headerName: יחידה
        minWidth: 280
        cellRendererParams:
          suppressCount: false
      getDataPath:
        _function:
          __args: 0
          __return: { __args: 0.path }
      columnDefs:
        - { field: level, headerName: רמה, width: 80 }
        - { field: child_count, headerName: ילדים, width: 80 }

        # Action column 1 — add child (admin only)
        - field: col_add_child
          headerName: ''
          width: 60
          sortable: false
          filter: false
          cellRenderer:
            _function:
              __args: 0
              __return:
                _nunjucks:
                  template: |
                    {% if isAdmin %}<span title="הוסף תת" style="cursor:pointer">＋</span>{% endif %}
                  on:
                    isAdmin:
                      _array.includes:
                        on: { _user: roles }
                        value: unit_admin

        # Action column 2 — rename (admin OR team_manager on own team row)
        - field: col_rename
          headerName: ''
          width: 60
          sortable: false
          filter: false
          cellRenderer:
            _function:
              __args: 0
              __return:
                _nunjucks:
                  template: |
                    {% if canRename %}<span title="שינוי שם" style="cursor:pointer">✎</span>{% endif %}
                  on:
                    canRename:
                      _or:
                        - _array.includes:
                            on: { _user: roles }
                            value: unit_admin
                        - _and:
                            - _array.includes:
                                on: { _user: roles }
                                value: team_manager
                            - _array.includes:
                                on: { _user: team_ids }
                                value: { __args: 0.data.id }

        # Action column 3 — delete (admin only, leaf only)
        - field: col_delete
          headerName: ''
          width: 60
          sortable: false
          filter: false
          cellRenderer:
            _function:
              __args: 0
              __return:
                _nunjucks:
                  template: |
                    {% if isAdmin and children == 0 %}<span title="מחק" style="cursor:pointer;color:#FF4D4F">🗑</span>{% endif %}
                  on:
                    isAdmin:
                      _array.includes:
                        on: { _user: roles }
                        value: unit_admin
                    children: { __args: 0.data.child_count }
      events:
        # W6 Pattern A: route by column.field, never by an HTML data attribute.
        # Captures row context to _state for the chained Confirm + Request actions
        # rendered in the modals/cards below.
        onCellClicked:
          - id: capture_row
            type: SetState
            params:
              clicked_column: { _event: column.field }
              clicked_row_id: { _event: data.id }
              clicked_row_name: { _event: data.name }
              clicked_row_level: { _event: data.level }
              clicked_row_child_count: { _event: data.child_count }

          # ---- col_rename branch — admin OR team_manager on own team row ----
          - id: prefill_rename
            type: SetState
            if:
              _and:
                - { _eq: [{ _state: clicked_column }, col_rename] }
                - _or:
                    - _array.includes:
                        on: { _user: roles }
                        value: unit_admin
                    - _and:
                        - _array.includes:
                            on: { _user: roles }
                            value: team_manager
                        - _array.includes:
                            on: { _user: team_ids }
                            value: { _state: clicked_row_id }
            params:
              edit_unit_id: { _state: clicked_row_id }
              edit_name_input: { _state: clicked_row_name }
              show_rename_modal: true

          # ---- col_delete branch — admin only, leaf only ----
          - id: confirm_delete
            type: Confirm
            if:
              _and:
                - { _eq: [{ _state: clicked_column }, col_delete] }
                - _array.includes:
                    on: { _user: roles }
                    value: unit_admin
                - { _eq: [{ _state: clicked_row_child_count }, 0] }
            params:
              title: מחיקת יחידה
              content:
                _nunjucks:
                  template: 'האם למחוק את היחידה "{{ name }}"? פעולה זו אינה הפיכה.'
                  on:
                    name: { _state: clicked_row_name }
              okText: מחק
              cancelText: ביטול
              okType: danger
          - id: stage_delete_id
            type: SetState
            if:
              _and:
                - { _eq: [{ _state: clicked_column }, col_delete] }
                - _array.includes:
                    on: { _user: roles }
                    value: unit_admin
                - { _eq: [{ _state: clicked_row_child_count }, 0] }
            params:
              delete_unit_id: { _state: clicked_row_id }
          - id: do_delete
            type: Request
            if:
              _and:
                - { _eq: [{ _state: clicked_column }, col_delete] }
                - _array.includes:
                    on: { _user: roles }
                    value: unit_admin
                - { _eq: [{ _state: clicked_row_child_count }, 0] }
            params:
              requestId: delete_org_unit
          - id: refresh_after_delete
            type: Request
            if: { _eq: [{ _state: clicked_column }, col_delete] }
            params:
              requestId: list_units

          # ---- col_add_child branch — admin only, may need D-04 grow-depth modal ----
          - id: stash_add_target
            type: SetState
            if:
              _and:
                - { _eq: [{ _state: clicked_column }, col_add_child] }
                - _array.includes:
                    on: { _user: roles }
                    value: unit_admin
            params:
              add_child_target_id: { _state: clicked_row_id }
              add_child_target_level: { _state: clicked_row_level }
          - id: fetch_tenant_depth
            type: Request
            if:
              _and:
                - { _eq: [{ _state: clicked_column }, col_add_child] }
                - _array.includes:
                    on: { _user: roles }
                    value: unit_admin
            params:
              requestId: get_tenant_depth
          - id: confirm_grow_depth
            type: Confirm
            # Only when admin clicks add-child on a node whose level + 1 exceeds
            # current tenant.org_depth (i.e., child would be deeper than allowed
            # — admin must consent to grow the hierarchy).
            if:
              _and:
                - { _eq: [{ _state: clicked_column }, col_add_child] }
                - _array.includes:
                    on: { _user: roles }
                    value: unit_admin
                - _gt:
                    - { _sum: [{ _state: clicked_row_level }, 1] }
                    - { _request: get_tenant_depth.0.org_depth }
            params:
              title: הגדלת עומק היררכיה
              content:
                _nunjucks:
                  template: 'ההוספה תעלה את המבנה ל-{{ n }} רמות. פעולה זו משנה את מבנה הארגון. להמשיך?'
                  on:
                    n: { _sum: [{ _state: clicked_row_level }, 1] }
              okText: המשך
              cancelText: ביטול
              okType: danger
          - id: stage_new_depth
            type: SetState
            if:
              _and:
                - { _eq: [{ _state: clicked_column }, col_add_child] }
                - _array.includes:
                    on: { _user: roles }
                    value: unit_admin
                - _gt:
                    - { _sum: [{ _state: clicked_row_level }, 1] }
                    - { _request: get_tenant_depth.0.org_depth }
            params:
              confirmed_new_depth: { _sum: [{ _state: clicked_row_level }, 1] }
          - id: open_add_child_modal
            type: SetState
            if:
              _and:
                - { _eq: [{ _state: clicked_column }, col_add_child] }
                - _array.includes:
                    on: { _user: roles }
                    value: unit_admin
            params:
              show_add_child_modal: true

  # ----- Add child modal (D-04 path; calls grow_org_depth_and_add_child) -----
  - id: add_child_modal
    type: Modal
    properties:
      visible: { _state: show_add_child_modal }
      title:
        _nunjucks:
          template: 'הוספת תת-יחידה תחת "{{ parent }}"'
          on:
            parent: { _state: clicked_row_name }
      okText: צור
      cancelText: ביטול
    events:
      onOk:
        - { id: do_grow_or_add, type: Request, params: { requestId: grow_org_depth_and_add_child } }
        - { id: close_modal, type: SetState, params: { show_add_child_modal: false, add_child_name_input: '' } }
        - { id: refresh_units, type: Request, params: { requestId: list_units } }
        - { id: refresh_depth, type: Request, params: { requestId: get_tenant_depth } }
      onCancel:
        - { id: close_modal, type: SetState, params: { show_add_child_modal: false, add_child_name_input: '' } }
    blocks:
      - id: add_child_name_input
        type: TextInput
        properties:
          label: שם היחידה החדשה

  # ----- Rename modal (D-02; calls rename_org_unit unchanged) -----
  - id: rename_modal
    type: Modal
    properties:
      visible: { _state: show_rename_modal }
      title: שינוי שם יחידה
      okText: שמור
      cancelText: ביטול
    events:
      onOk:
        - { id: do_rename, type: Request, params: { requestId: rename_org_unit } }
        - { id: close_rename, type: SetState, params: { show_rename_modal: false } }
        - { id: refresh_after_rename, type: Request, params: { requestId: list_units } }
      onCancel:
        - { id: close_rename, type: SetState, params: { show_rename_modal: false } }
    blocks:
      - id: edit_name_input
        type: TextInput
        properties:
          label: שם חדש

  # ----- Phase 1 fallback create form (UI-SPEC: "Cards from Phase 1 KEPT as fallback create form below the tree") -----
  - id: create_card
    type: Card
    properties:
      title: יצירת יחידה חדשה (טופס fallback)
    blocks:
      - id: parent_id_select
        type: Selector
        properties:
          label: יחידת אם
          options:
            _request: list_units
      - id: level_input
        type: NumberInput
        properties:
          label: רמה
          min: 1
          max: 3
      - id: name_input
        type: TextInput
        properties:
          label: שם
      - id: create_btn
        type: Button
        properties:
          title: צור יחידה
        events:
          onClick:
            - { id: do_create, type: Request, params: { requestId: create_org_unit } }
            - { id: refresh, type: Request, params: { requestId: list_units } }

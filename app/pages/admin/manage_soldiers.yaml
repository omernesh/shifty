id: manage_soldiers
type: PageHeaderMenu
properties:
  title: 'ניהול חיילים | shifty'

# D-05 tenant-wide soldier roster (admin + team_manager scoped at query level).
# READ + single-row CREATE only — edit + archive land in plan 06 (soldier_detail),
# bulk import in plan 08 (roster_import). manage_role_tags is plan 05.
#
# Layer 1 (session): every payload sets tenant_id from `_user: tenant_id` — never from _payload.
# Layer 2 (query):   every KnexRaw block filters by WHERE tenant_id = :tenant_id (CI grep gate).
# Layer 3 (page):    auth.roles allowlist above.
# Layer 4 (plugin):  CreateSoldier (shifty-roster) reads tenant_id from request.user — not properties.
# Layer 5 (RLS):     0009 policy on `soldier` covers cross-tenant DB-level breach.

requests:
  # ── List active soldiers in this tenant ────────────────────────────────────
  # ROST-01 (list + filter) + ROST-05 (status='active' filter; archived hidden).
  # Partial index `idx_soldier_tenant_status WHERE status = 'active'` from 0002
  # makes this SELECT cheap even at thousands of soldiers per tenant.
  # NOTE: the literal SQL fragment `s.status = 'active'` is one contiguous token —
  # verify-command grep searches for it as ONE substring (W4 fix from PLAN revision iter 1).
  - id: list_soldiers
    type: KnexRaw
    connectionId: shifts_db
    payload:
      tenant_id:
        _user: tenant_id
    properties:
      query: |
        SELECT s.id, s.display_name, s.color, s.seniority, s.role_tags,
               s.phone_e164, s.status, au.email
        FROM soldier s
        LEFT JOIN app_user au ON au.id = s.user_id
        WHERE s.tenant_id = :tenant_id
          AND s.status = 'active'
        ORDER BY s.display_name
      parameters:
        tenant_id: { _payload: tenant_id }

  # ── Feed TagSelector autocomplete in the Add-soldier Modal ─────────────────
  # D-13: per-tenant role-tag catalog from plan 01's migration 0011_role_tag.
  - id: list_role_tags
    type: KnexRaw
    connectionId: shifts_db
    payload:
      tenant_id:
        _user: tenant_id
    properties:
      query: |
        SELECT key AS value, COALESCE(label, key) AS label
        FROM role_tag
        WHERE tenant_id = :tenant_id
        ORDER BY key
      parameters:
        tenant_id: { _payload: tenant_id }

  # ── Feed team Selector in the Add-soldier Modal (leaf nodes only) ──────────
  # TEN-05: schedules + assignments live at leaf nodes. NOT EXISTS sub-select
  # excludes any org_unit that has children. Both arms scoped by tenant_id.
  - id: list_leaf_teams
    type: KnexRaw
    connectionId: shifts_db
    payload:
      tenant_id:
        _user: tenant_id
    properties:
      query: |
        SELECT id AS value, name AS label
        FROM org_unit
        WHERE tenant_id = :tenant_id
          AND NOT EXISTS (
            SELECT 1 FROM org_unit child
            WHERE child.parent_id = org_unit.id
              AND child.tenant_id = :tenant_id
          )
        ORDER BY name
      parameters:
        tenant_id: { _payload: tenant_id }

  # ── Custom plugin request from shifty-roster ───────────────────────────────
  # Plan 02-02 registered CreateSoldier as a stub handler (returns placeholder
  # soldier_id). Plan 06 fills the full INSERT body (canonicalize display_name,
  # pick palette color, insert soldier + optional app_user + optional membership
  # in one txn, write schedule_audit). This page wires the form → handler now
  # so plan 06 is a pure body-fill.
  #
  # Layer 4: the handler reads tenant_id from request.user.tenant_id — never
  # from request.properties. The payload fields below are the schema CreateSoldier
  # validates (D-06 + plan 02 schema): display_name required, others optional.
  - id: create_soldier_request
    type: CreateSoldier
    connectionId: shifts_db
    payload:
      display_name: { _state: new_soldier_form.display_name }
      email: { _state: new_soldier_form.email }
      seniority: { _state: new_soldier_form.seniority }
      role_tags: { _state: new_soldier_form.role_tags }
      phone_e164: { _state: new_soldier_form.phone_e164 }
      team_id: { _state: new_soldier_form.team_id }

blocks:
  - id: title
    type: Title
    properties:
      # i18n: soldiers.title
      content: ניהול חיילים
      level: 1

  # ── Toolbar (UI-SPEC Page 2 wireframe) ─────────────────────────────────────
  # Left: primary "Add" button → opens Modal.
  # Middle: CSV-import button → Link to roster_import (page itself lands in plan 08;
  #   a missing destination route renders a Lowdefy 404 gracefully — acceptable per
  #   plan scope_constraints).
  # Right: search TextInput → drives AgGrid quickFilterText (AgGrid native filter).
  - id: toolbar
    type: Box
    properties:
      contentGutter: [8, 8]
      contentJustify: space-between
      contentAlign: middle
    blocks:
      - id: toolbar_left
        type: Box
        properties:
          contentGutter: [8, 8]
        blocks:
          - id: add_soldier_btn
            type: Button
            properties:
              # i18n: soldiers.add_button
              title: הוסף חייל
              type: primary
              icon: AiOutlinePlus
            events:
              onClick:
                - id: open_modal
                  type: SetState
                  params:
                    show_add_modal: true
          - id: csv_import_btn
            type: Button
            properties:
              # i18n: soldiers.import_csv_button
              title: ייבא CSV
              type: default
              icon: AiOutlineUpload
            events:
              onClick:
                - id: go_import
                  type: Link
                  params:
                    pageId: roster_import
      - id: toolbar_right
        type: Box
        blocks:
          - id: search_input
            type: TextInput
            properties:
              # i18n: soldiers.search_placeholder
              placeholder: חיפוש
              size: middle
            events:
              onChange:
                - id: set_filter
                  type: SetState
                  params:
                    search_query: { _state: search_input }

  # ── Roster grid (UI-SPEC Page 2 + Reusable Components §8 + §9) ─────────────
  # enableRtl MANDATORY per UI-SPEC §"Reusable Components — 8".
  # Color dot cellRenderer copied byte-equal from UI-SPEC §"Reusable Components — 9".
  # Row click → soldier_detail/{id} (D-06).
  - id: soldiers_grid
    type: AgGridAlpine
    properties:
      enableRtl: true
      pagination: true
      paginationPageSize: 25
      rowSelection: single
      animateRows: true
      quickFilterText: { _state: search_query }
      rowData: { _request: list_soldiers }
      defaultColDef:
        sortable: true
        resizable: true
        filter: true
        flex: 1
      columnDefs:
        - field: color
          headerName: ''
          width: 40
          editable: false
          sortable: false
          filter: false
          cellRenderer:
            _function:
              __args: 0
              __return:
                _nunjucks:
                  template: '<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:{{ value }};border:1px solid #fff;box-shadow:0 0 0 1px #D9D9D9"></span>'
                  on:
                    value: { __args: 0.value }
        - field: display_name
          headerName: שם
          flex: 2
        - field: email
          headerName: אימייל
          flex: 2
        - field: seniority
          headerName: ותק
          width: 80
          type: numericColumn
        - field: role_tags
          headerName: תגיות
          flex: 2
          valueFormatter:
            _function:
              __args: 0
              __return:
                _nunjucks:
                  template: '{{ value | join(", ") }}'
                  on:
                    value: { __args: 0.value }
        - field: status
          headerName: מצב
          width: 100
          cellRenderer:
            _function:
              __args: 0
              __return:
                _nunjucks:
                  template: "{{ 'פעיל' if value == 'active' else 'מארכב' }}"
                  on:
                    value: { __args: 0.value }
    events:
      onRowClicked:
        - id: open_detail
          type: Link
          params:
            pageId: soldier_detail
            urlQuery:
              id: { _event: data.id }

  # ── Empty-state Result (UI-SPEC Hebrew copy table line 228) ────────────────
  # Visible only when list_soldiers is empty AND request has resolved.
  - id: empty_state
    type: Result
    visible:
      _eq:
        - { _request: list_soldiers.length }
        - 0
    properties:
      status: info
      icon: AiOutlineInbox
      # i18n: soldiers.empty_title
      title: אין חיילים בארגון
      # i18n: soldiers.empty_subtitle
      subTitle: הוסף חייל בודד או ייבא קובץ CSV
    blocks:
      - id: empty_actions
        type: Box
        properties:
          contentGutter: [8, 8]
          contentJustify: center
        blocks:
          - id: empty_add_btn
            type: Button
            properties:
              title: הוסף חייל
              type: primary
              icon: AiOutlinePlus
            events:
              onClick:
                - id: open_modal_from_empty
                  type: SetState
                  params:
                    show_add_modal: true
          - id: empty_import_btn
            type: Button
            properties:
              title: ייבא CSV
              type: default
              icon: AiOutlineUpload
            events:
              onClick:
                - id: go_import_from_empty
                  type: Link
                  params:
                    pageId: roster_import

  # ── Add-soldier Modal ─────────────────────────────────────────────────────
  # Six fields per CONTEXT D-06 + D-07: display_name (req), email (opt),
  # seniority (NumberInput 0-10, default 0), role_tags (TagSelector backed by
  # list_role_tags), phone_e164 (opt), team_id (Selector backed by leaf teams).
  # OnOk action chain: Validate → CreateSoldier → refresh list → close + reset
  # + toast. CreateSoldier handles canonicalization at write time (D-12).
  - id: add_soldier_modal
    type: Modal
    properties:
      visible: { _state: show_add_modal }
      title: הוספת חייל
      okText: צור חייל
      cancelText: ביטול
      width: 560
    events:
      onOk:
        - id: validate_form
          type: Validate
          params: new_soldier_form
        - id: do_create
          type: Request
          params:
            requestId: create_soldier_request
        - id: refresh_soldiers
          type: Request
          params:
            requestId: list_soldiers
        - id: refresh_tags
          type: Request
          params:
            requestId: list_role_tags
        - id: close_modal
          type: SetState
          params:
            show_add_modal: false
        - id: reset_form
          type: Reset
          params: new_soldier_form
        - id: success_toast
          type: DisplayMessage
          params:
            status: success
            content:
              _nunjucks:
                template: 'החייל "{{ name }}" נוצר'
                on:
                  name: { _state: new_soldier_form.display_name }
            duration: 3
      onCancel:
        - id: close_modal_cancel
          type: SetState
          params:
            show_add_modal: false
    blocks:
      - id: new_soldier_form
        type: Box
        blocks:
          - id: new_soldier_form.display_name
            type: TextInput
            required: true
            properties:
              # i18n: soldiers.form.display_name
              label: שם מלא
              size: large
          - id: new_soldier_form.email
            type: TextInput
            validate:
              - type: email
                message: כתובת אימייל לא תקפה
            properties:
              # i18n: soldiers.form.email
              label: 'אימייל (ניתן להשאיר ריק ולשלוח הזמנה אחר כך)'
              size: large
          - id: new_soldier_form.seniority
            type: NumberInput
            required: true
            properties:
              # i18n: soldiers.form.seniority
              label: ותק
              min: 0
              max: 10
              defaultValue: 0
              size: large
          - id: new_soldier_form.role_tags
            type: TagSelector
            properties:
              # i18n: soldiers.form.role_tags
              label: תגיות תפקיד
              options: { _request: list_role_tags }
          - id: new_soldier_form.phone_e164
            type: TextInput
            properties:
              # i18n: soldiers.form.phone
              label: 'טלפון (פורמט בינלאומי +972...)'
          - id: new_soldier_form.team_id
            type: Selector
            properties:
              # i18n: soldiers.form.team
              label: צוות
              options: { _request: list_leaf_teams }
              allowClear: true

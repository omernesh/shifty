id: team_detail
type: PageHeaderMenu
properties:
  title: 'צוות | shifty'

# Plan 02-07 Task 2 — per-team detail page (D-03, D-05, D-08).
#
# URL: /team_detail?id={uuid}. The :id query param is read via _url_query.id
# (Lowdefy 5.3.x; same pattern as soldier_detail in plan 02-06).
#
# 3-card layout per UI-SPEC §"Page 4":
#   1. פרטי צוות (team metadata)        — read-only
#   2. חברי צוות (team members)         — AgGrid + Add/Remove + Phase 3 placeholder
#   3. תבנית משמרות placeholder         — D-03 promise card for Phase 3
#
# Membership writes (D-08) live HERE in Phase 2; soldier_detail's Teams
# MultipleSelector is read-only (plan 02-06 scope choice). Concentrating
# add/remove on team_detail keeps the audit trail unambiguous.
#
# 4-layer tenant isolation:
#   Layer 1 (session):  every payload sets tenant_id from `_user: tenant_id`.
#   Layer 2 (query):    every KnexRaw filters by WHERE tenant_id = :tenant_id;
#                       list queries additionally filter by `s.status = 'active'`
#                       as one canonical SQL token (W4 fix).
#   Layer 3 (page):     auth.roles allowlist above.
#   Layer 4 (plugin / SQL gate):
#                       CreateMembership reads tenant_id from request.user;
#                       remove_membership KnexRaw includes the SQL gate
#                       `(:is_admin OR :team_id = ANY(:caller_team_ids))`.
#                       *** caller_team_ids binding is LITERALLY `_user: team_ids`
#                       (W7 fix — verify-command grep regex
#                       `caller_team_ids\s*:\s*\{\s*_user:\s*team_ids\s*\}` locks
#                       this so future edits cannot rebind it to a forgeable
#                       _state / _payload / _input source). ***
#   Layer 5 (RLS):      0009 policy on membership covers DB-level breach.

requests:
  # ── Load the team row ──────────────────────────────────────────────────────
  - id: get_team
    type: KnexRawTenant
    connectionId: shifts_db
    payload:
      tenant_id:
        _user: tenant_id
      team_id:
        _url_query: id
    properties:
      query: |
        SELECT ou.id,
               ou.name,
               ou.parent_id,
               ou.level,
               ou.last_color_index,
               (SELECT p.name FROM org_unit p
                 WHERE p.id = ou.parent_id
                   AND p.tenant_id = :tenant_id) AS parent_name
          FROM org_unit ou
         WHERE ou.tenant_id = :tenant_id
           AND ou.id = :team_id
      parameters:
        tenant_id: { _payload: tenant_id }
        team_id: { _payload: team_id }

  # ── List the team's active members (D-08) ─────────────────────────────────
  # Both `s.tenant_id = :tenant_id` AND `m.tenant_id = :tenant_id` filters
  # — defense-in-depth even though FK chain already implies tenant equality.
  # `s.status = 'active'` is one canonical SQL token (W4 fix); archived
  # soldiers preserve membership rows (D-08) but are hidden from this picker.
  - id: list_team_members
    type: KnexRawTenant
    connectionId: shifts_db
    payload:
      tenant_id:
        _user: tenant_id
      team_id:
        _url_query: id
    properties:
      query: |
        SELECT s.id,
               s.display_name,
               s.color,
               s.seniority,
               s.role_tags,
               s.status,
               au.email,
               m.id AS membership_id,
               m.role AS membership_role
          FROM soldier s
          JOIN membership m ON m.soldier_id = s.id
          LEFT JOIN app_user au ON au.id = s.user_id
         WHERE s.tenant_id = :tenant_id
           AND m.tenant_id = :tenant_id
           AND m.org_unit_id = :team_id
           AND s.status = 'active'
         ORDER BY s.display_name
      parameters:
        tenant_id: { _payload: tenant_id }
        team_id: { _payload: team_id }

  # ── List soldiers in the tenant who are NOT yet on this team ───────────────
  # Feeds the Add-member MultipleSelector. NOT EXISTS sub-select filtered by
  # tenant_id on both arms. Only active soldiers are eligible.
  - id: list_addable_soldiers
    type: KnexRawTenant
    connectionId: shifts_db
    payload:
      tenant_id:
        _user: tenant_id
      team_id:
        _url_query: id
    properties:
      query: |
        SELECT s.id AS value,
               s.display_name AS label
          FROM soldier s
         WHERE s.tenant_id = :tenant_id
           AND s.status = 'active'
           AND NOT EXISTS (
             SELECT 1
               FROM membership m
              WHERE m.soldier_id = s.id
                AND m.org_unit_id = :team_id
                AND m.tenant_id = :tenant_id
           )
         ORDER BY s.display_name
      parameters:
        tenant_id: { _payload: tenant_id }
        team_id: { _payload: team_id }

  # ── CreateMembership — shifty-roster plugin handler (DB-touching) ─────────
  # The handler reads tenant_id, caller_team_ids, is_admin from request.user
  # (session) — never from request.properties. The payload below supplies the
  # add-member form's soldier_id, team_id from the URL, and a fixed
  # role='member' (Phase 2 ships single membership-role on Add).
  - id: create_membership_request
    type: CreateMembership
    connectionId: shifts_db
    payload:
      soldier_id: { _state: add_member_form.soldier_id }
      team_id: { _url_query: id }
      role: member

  # ── remove_membership — KnexRaw DELETE with Layer-4 SQL gate ──────────────
  # The SQL gate `(:is_admin OR :team_id = ANY(:caller_team_ids))` allows
  # admins unconditionally + team_managers only when the team is in their
  # caller_team_ids.
  #
  # *** W7 fix — caller_team_ids in this payload binds LITERALLY to
  # `_user: team_ids` (session-derived). The verify command greps for the
  # regex `caller_team_ids\s*:\s*\{\s*_user:\s*team_ids\s*\}` to lock this
  # binding so a future edit cannot accidentally rebind it to
  # `_state.something` or `_input.something` and forge it. ***
  #
  # D-08 chose hard DELETE for membership rows because:
  #   - membership has no archive concept (UNIQUE(soldier_id, org_unit_id)
  #     plus historical correctness lives in `assignment` snapshots from
  #     Phase 3+, not in membership row retention).
  #   - Schedule history is preserved by snapshot pattern on assignment.
  - id: remove_membership
    type: KnexRawTenant
    connectionId: shifts_db
    payload:
      tenant_id: { _user: tenant_id }
      membership_id: { _state: remove_target_membership_id }
      team_id: { _url_query: id }
      caller_team_ids: { _user: team_ids }
      is_admin:
        _array.includes:
          on: { _user: roles }
          value: unit_admin
    properties:
      query: |
        DELETE FROM membership
         WHERE id = :membership_id
           AND org_unit_id = :team_id
           AND tenant_id = :tenant_id
           AND (:is_admin OR :team_id = ANY(:caller_team_ids))
         RETURNING soldier_id, org_unit_id
      parameters:
        tenant_id: { _payload: tenant_id }
        membership_id: { _payload: membership_id }
        team_id: { _payload: team_id }
        caller_team_ids: { _payload: caller_team_ids }
        is_admin: { _payload: is_admin }

  # ── audit_remove_membership — chained audit write after DELETE ────────────
  # Matches the shifty-audit-writer plugin's AuditWrite schema:
  # to_state required; actor_user_id derived from session inside the handler.
  - id: audit_remove_membership
    type: AuditWrite
    connectionId: shifts_db
    payload:
      to_state: membership_removed
      actor_kind: user
      payload_json:
        membership_id: { _state: remove_target_membership_id }
        team_id: { _url_query: id }
        soldier_id: { _request: remove_membership.0.soldier_id }

  # ─── Phase 03 plan 03-03: shift_slot management for the משמרות card ───────
  # All payloads bind tenant_id via `_user: tenant_id` (NEVER from input).

  # List active shift_slot rows for this team (UI-SPEC Surface 1 grid).
  - id: load_team_slots
    type: KnexRawTenant
    connectionId: shifts_db
    payload:
      tenant_id:
        _user: tenant_id
      team_id:
        _url_query: id
    properties:
      query: |
        SELECT id,
               name,
               start_time::text AS start_time,
               end_time::text   AS end_time,
               headcount,
               required_role_tags,
               min_seniority,
               display_order,
               (end_time < start_time) AS crosses_midnight
          FROM shift_slot
         WHERE tenant_id = :tenant_id
           AND team_id   = :team_id
         ORDER BY display_order, name
      parameters:
        tenant_id: { _payload: tenant_id }
        team_id: { _payload: team_id }

  # Used to decide whether the template-wizard CTA is visible. Returns one row
  # with the team's template_picked_at (NULL = wizard has not yet run).
  - id: load_template_picked_at
    type: KnexRawTenant
    connectionId: shifts_db
    payload:
      tenant_id:
        _user: tenant_id
      team_id:
        _url_query: id
    properties:
      query: |
        SELECT template_picked_at
          FROM org_unit
         WHERE tenant_id = :tenant_id
           AND id        = :team_id
      parameters:
        tenant_id: { _payload: tenant_id }
        team_id: { _payload: team_id }

  # Feeds the MultipleSelector inside the slot form (same shape as the
  # manage_soldiers form's role-tag picker).
  - id: list_role_tags
    type: KnexRawTenant
    connectionId: shifts_db
    payload:
      tenant_id:
        _user: tenant_id
    properties:
      query: |
        SELECT key AS value, COALESCE(label, key) AS label
          FROM role_tag
         WHERE tenant_id = :tenant_id
         ORDER BY key
      parameters:
        tenant_id: { _payload: tenant_id }

  # CreateShiftSlot — handler derives tenant_id from session. The payload here
  # supplies the form fields + the team_id from the URL.
  - id: create_shift_slot_request
    type: CreateShiftSlot
    connectionId: shifts_db
    payload:
      team_id: { _url_query: id }
      name: { _state: shift_slot_form.name }
      start_time: { _state: shift_slot_form.start_time }
      end_time: { _state: shift_slot_form.end_time }
      headcount: { _state: shift_slot_form.headcount }
      required_role_tags: { _state: shift_slot_form.required_role_tags }
      min_seniority: { _state: shift_slot_form.min_seniority }
      display_order: { _state: shift_slot_form.display_order }

  # UpdateShiftSlot — same form payload, but with shift_slot_id from state.
  - id: update_shift_slot_request
    type: UpdateShiftSlot
    connectionId: shifts_db
    payload:
      shift_slot_id: { _state: edit_target_shift_slot_id }
      name: { _state: shift_slot_form.name }
      start_time: { _state: shift_slot_form.start_time }
      end_time: { _state: shift_slot_form.end_time }
      headcount: { _state: shift_slot_form.headcount }
      required_role_tags: { _state: shift_slot_form.required_role_tags }
      min_seniority: { _state: shift_slot_form.min_seniority }
      display_order: { _state: shift_slot_form.display_order }

  # DeleteShiftSlot — handler refuses when shift_instance rows reference the slot
  # (throws Error('shift_slot_has_instances') — the YAML toast catches and renders
  # a Hebrew message keyed on that discriminator).
  - id: delete_shift_slot_request
    type: DeleteShiftSlot
    connectionId: shifts_db
    payload:
      shift_slot_id: { _state: delete_target_shift_slot_id }

  # ApplyShiftTemplate — wizard handler. Refuses to overwrite if any slot
  # already exists; sets org_unit.template_picked_at in the same TX.
  - id: apply_shift_template_request
    type: ApplyShiftTemplate
    connectionId: shifts_db
    payload:
      team_id: { _url_query: id }
      template_key: { _state: selected_template }

blocks:
  - id: page_title
    type: Title
    properties:
      content:
        _nunjucks:
          template: '{{ name }} | צוות'
          on:
            name: { _request: get_team.0.name }
      level: 1

  # ─────────────────────── Card 1: פרטי צוות ─────────────────────────────
  - id: card_team_meta
    type: Card
    properties:
      title: פרטי צוות
      # L-3 (round 2): headStyle removed — silently dropped in 5.3. RTL header from dir="rtl".
      style:
        marginBottom: 24
    blocks:
      - id: team_name_display
        type: Paragraph
        properties:
          content:
            _nunjucks:
              template: 'שם: {{ name }}'
              on:
                name: { _request: get_team.0.name }
      - id: team_parent_display
        type: Paragraph
        visible: { _request: get_team.0.parent_name }
        properties:
          content:
            _nunjucks:
              template: 'שייכות: {{ parent }} › {{ name }}'
              on:
                parent: { _request: get_team.0.parent_name }
                name: { _request: get_team.0.name }
      - id: team_level_display
        type: Paragraph
        properties:
          content:
            _nunjucks:
              template: 'רמה: {{ level }}'
              on:
                level: { _request: get_team.0.level }

  # ─────────────────────── Card 2: חברי צוות ─────────────────────────────
  - id: card_team_members
    type: Card
    properties:
      title: חברי צוות
      # L-3 (round 2): headStyle removed — silently dropped in 5.3. RTL header from dir="rtl".
      style:
        marginBottom: 24
    blocks:
      # Toolbar — primary "+ Add member" button.
      # D-1/D-2/D-4 (round 2): Box with content* layout props → Flex with properties.
      - id: members_toolbar
        type: Flex
        properties:
          gap: small
          justify: flex-start
          align: center
          style:
            marginBottom: 12
        blocks:
          - id: add_member_btn
            type: Button
            properties:
              # i18n: team_detail.add_member_button
              title: הוסף חבר לצוות
              type: primary
              icon: AiOutlinePlus
            events:
              onClick:
                - id: open_add_member_modal
                  type: SetState
                  params:
                    show_add_member_modal: true

      # Members AgGrid (UI-SPEC §"Reusable Components — 8" enableRtl + §9 dot)
      # Action column "actions" (W6 Pattern A): one single-affordance icon-button
      # per row. onCellClick branches on _event.cell.column — the body
      # columns dispatch to soldier_detail/{id}; the actions column dispatches
      # the remove flow with a ConfirmModal step.
      - id: team_members_grid
        type: AgGridAlpine
        properties:
          # L-2 (round 2): enableRtl + rowSelection + animateRows stripped —
          # not in 5.3 AgGrid whitelist. RTL from page-level dir="rtl".
          pagination: false
          rowData: { _request: list_team_members }
          defaultColDef:
            sortable: true
            resizable: true
            filter: true
            flex: 1
          columnDefs:
            - field: color
              headerName: ''
              width: 40
              editable: false
              sortable: false
              filter: false
              cellRenderer:
                _function:
                  __args: 0
                  __return:
                    _nunjucks:
                      template: '<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:{{ value }};border:1px solid #fff;box-shadow:0 0 0 1px #D9D9D9"></span>'
                      on:
                        value: { __args: 0.value }
            - field: display_name
              headerName: שם
              flex: 2
            - field: email
              headerName: אימייל
              flex: 2
            - field: seniority
              headerName: ותק
              width: 80
              type: numericColumn
            - field: role_tags
              headerName: תגיות
              flex: 2
              valueFormatter:
                _function:
                  __args: 0
                  __return:
                    _nunjucks:
                      template: '{{ value | join(", ") }}'
                      on:
                        value: { __args: 0.value }
            - field: status
              headerName: מצב
              width: 100
              cellRenderer:
                _function:
                  __args: 0
                  __return:
                    _nunjucks:
                      template: "{{ 'פעיל' if value == 'active' else 'מארכב' }}"
                      on:
                        value: { __args: 0.value }
            # Action column — single icon: remove member.
            - field: actions
              headerName: ''
              width: 60
              sortable: false
              filter: false
              cellRenderer:
                _function:
                  __args: 0
                  __return:
                    _nunjucks:
                      template: '<span title="הסר" style="cursor:pointer;color:#FF4D4F">🗑</span>'
        events:
          # Lowdefy 5.3 column-dispatch via per-action skip: gates (verified).
          # skip: semantics are INVERTED — action fires when skip evaluates false.
          # Event name is onCellClick (singular); payload is cell.column + row.<field>.
          # The two mutually-exclusive branches share `cell.column == actions`
          # as the discriminator: actions column → remove flow; any other body
          # column → navigate to soldier_detail.
          onCellClick:
            # ── actions column branch: capture row + open ConfirmModal ──
            - id: set_remove_target
              type: SetState
              skip: { _not: { _eq: [{ _event: cell.column }, actions] } }
              params:
                remove_target_membership_id: { _event: row.membership_id }
                remove_target_display_name: { _event: row.display_name }
            - id: open_remove_confirm
              type: CallMethod
              skip: { _not: { _eq: [{ _event: cell.column }, actions] } }
              params:
                blockId: remove_confirm_modal
                method: toggleOpen
            # ── body-column branch: open soldier_detail in same window ──
            - id: open_detail
              type: Link
              skip: { _eq: [{ _event: cell.column }, actions] }
              params:
                pageId: soldier_detail
                urlQuery:
                  id: { _event: row.id }

      # Empty-state for the members grid (UI-SPEC Hebrew copy table line 229).
      - id: members_empty_state
        type: Result
        visible:
          _eq:
            - { _request: list_team_members.length }
            - 0
        properties:
          status: info
          icon: AiOutlineInbox
          # i18n: team_detail.empty_title
          title: הצוות ריק
          # i18n: team_detail.empty_subtitle
          subTitle: הוסף חברים כדי לראות אותם כאן
        blocks:
          - id: empty_add_btn
            type: Button
            properties:
              title: הוסף חבר לצוות
              type: primary
              icon: AiOutlinePlus
            events:
              onClick:
                - id: open_modal_from_empty
                  type: SetState
                  params:
                    show_add_member_modal: true

  # ─────────────────── Card 3: משמרות (Phase 03 plan 03-03) ─────────────────
  # REPLACES the P02 "פתח תבנית משמרות בשלב הבא" placeholder. UI-SPEC Surface 1.
  #
  # Layout (label-on-card matches Phase 02 card pattern; rather than introducing
  # an Ant Tabs component, the existing Phase-02 card structure is preserved and
  # the Phase 3 surface is added as a fourth card titled 'משמרות'. The visual
  # hierarchy is identical to the UI-SPEC's tab-strip wireframe in practice —
  # cards stack vertically on this page and the user navigates them by scroll.
  # Deviation rationale: introducing Ant Tabs would force a rewrite of the
  # already-UAT-passed P02 cards above, which is out of scope for 03-03).
  #
  # Toolbar (UI-SPEC Surface 1):
  #   '+ הוסף משמרת'   — opens the slot form Modal in 'create' mode.
  #   '↺ פתח תבנית'   — opens the template wizard Modal; visible only when
  #                       slot list is EMPTY *and* template_picked_at IS NULL.
  - id: card_shift_slots
    type: Card
    properties:
      title: משמרות
      style:
        marginBottom: 24
    blocks:
      # ── Toolbar ──────────────────────────────────────────────────────────
      - id: shift_slots_toolbar
        type: Flex
        properties:
          gap: small
          justify: space-between
          align: center
          style:
            marginBottom: 12
        blocks:
          - id: shift_slots_toolbar_left
            type: Flex
            properties:
              gap: small
            blocks:
              - id: add_shift_slot_btn
                type: Button
                properties:
                  # i18n: shifts.add_button
                  title: '+ הוסף משמרת'
                  type: primary
                  icon: AiOutlinePlus
                events:
                  onClick:
                    - id: reset_form_before_create
                      type: Reset
                      params: shift_slot_form
                    - id: clear_edit_target
                      type: SetState
                      params:
                        edit_target_shift_slot_id: null
                        shift_slot_form_mode: create
                    - id: open_shift_slot_form_modal
                      type: SetState
                      params:
                        show_shift_slot_form_modal: true
          - id: shift_slots_toolbar_right
            type: Box
            # The '↺ פתח תבנית' button is visible only when the team has zero
            # slots AND has never picked a template. _and over the two predicates.
            visible:
              _and:
                - { _eq: [{ _request: load_team_slots.length }, 0] }
                - { _eq: [{ _request: load_template_picked_at.0.template_picked_at }, null] }
            blocks:
              - id: open_template_wizard_btn
                type: Button
                properties:
                  # i18n: shifts.template_wizard_button
                  title: '↺ פתח תבנית'
                  type: default
                  icon: AiOutlineReload
                events:
                  onClick:
                    - id: reset_template_selection
                      type: SetState
                      params:
                        selected_template: null
                    - id: open_template_wizard_modal
                      type: SetState
                      params:
                        show_template_wizard_modal: true

      # ── AgGrid: slot list ────────────────────────────────────────────────
      # enableRtl removed from Lowdefy 5.3 whitelist; RTL comes from page-level dir="rtl".
      # Columns per UI-SPEC Surface 1: סדר | שם | זמנים | כמות | תגיות | ⓘ | פעולות
      - id: shift_slots_grid
        type: AgGridAlpine
        properties:
          pagination: false
          rowData: { _request: load_team_slots }
          defaultColDef:
            sortable: true
            resizable: true
            filter: true
            flex: 1
          columnDefs:
            - field: display_order
              headerName: סדר
              width: 70
              type: numericColumn
            - field: name
              headerName: שם
              flex: 2
            # Computed time-range column rendered via cellRenderer (no rowData mutation needed).
            - field: start_time
              headerName: זמנים
              flex: 2
              cellRenderer:
                _function:
                  __args: 0
                  __return:
                    _nunjucks:
                      template: '{{ start }}–{{ endt }}'
                      on:
                        start: { __args: 0.data.start_time }
                        endt: { __args: 0.data.end_time }
            - field: headcount
              headerName: כמות
              width: 90
              type: numericColumn
            - field: required_role_tags
              headerName: תגיות
              flex: 2
              valueFormatter:
                _function:
                  __args: 0
                  __return:
                    _nunjucks:
                      template: '{{ value | join(", ") }}'
                      on:
                        value: { __args: 0.value }
            # Cross-midnight indicator — AiOutlineInfoCircle when end<start.
            - field: crosses_midnight
              headerName: ''
              width: 50
              sortable: false
              filter: false
              cellRenderer:
                _function:
                  __args: 0
                  __return:
                    _nunjucks:
                      template: '{% if value %}<span title="מסתיים למחרת" style="color:#00000073">ⓘ</span>{% endif %}'
                      on:
                        value: { __args: 0.value }
            # Actions column — edit + delete icons.
            - field: actions
              headerName: ''
              width: 90
              sortable: false
              filter: false
              cellRenderer:
                _function:
                  __args: 0
                  __return:
                    _nunjucks:
                      template: '<span title="ערוך" style="cursor:pointer;margin-left:8px">✎</span><span title="מחק" style="cursor:pointer;color:#FF4D4F">✗</span>'
        events:
          # Column-dispatch: clicks on the 'actions' column trigger either edit or
          # delete depending on which icon was clicked (Lowdefy 5.3 lacks per-icon
          # event granularity inside a single cellRenderer, so for simplicity the
          # entire actions column opens the edit modal; row deletion uses the
          # adjacent delete affordance below — see secondary actions if needed).
          # For now we treat actions-column clicks as "edit" and provide a
          # separate delete via row-double-click — pragmatic choice for v1.
          onCellClick:
            # Edit branch — actions column → load row into form, open edit modal.
            - id: capture_edit_target
              type: SetState
              skip: { _not: { _eq: [{ _event: cell.column }, actions] } }
              params:
                edit_target_shift_slot_id: { _event: row.id }
                shift_slot_form_mode: edit
                shift_slot_form.name: { _event: row.name }
                shift_slot_form.start_time: { _event: row.start_time }
                shift_slot_form.end_time: { _event: row.end_time }
                shift_slot_form.headcount: { _event: row.headcount }
                shift_slot_form.required_role_tags: { _event: row.required_role_tags }
                shift_slot_form.min_seniority: { _event: row.min_seniority }
                shift_slot_form.display_order: { _event: row.display_order }
            - id: open_edit_modal
              type: SetState
              skip: { _not: { _eq: [{ _event: cell.column }, actions] } }
              params:
                show_shift_slot_form_modal: true
          # Double-click on any non-actions cell → delete confirmation.
          onRowDoubleClicked:
            - id: capture_delete_target
              type: SetState
              params:
                delete_target_shift_slot_id: { _event: row.id }
                delete_target_shift_slot_name: { _event: row.name }
            - id: open_delete_confirm_modal
              type: CallMethod
              params:
                blockId: shift_slot_delete_confirm_modal
                method: toggleOpen

      # Empty-state for the slot list. UI-SPEC line 320: when both empty AND template
      # never picked, the toolbar's '↺ פתח תבנית' button is the primary CTA, so the
      # Result block here is a short informational hint.
      - id: shift_slots_empty_state
        type: Result
        visible:
          _eq:
            - { _request: load_team_slots.length }
            - 0
        properties:
          status: info
          icon: AiOutlineInbox
          # i18n: shifts.empty_title
          title: אין משמרות מוגדרות
          # i18n: shifts.empty_subtitle
          subTitle: הוסף משמרת בודדת או פתח תבנית מוכנה

  # ────────────────── Add-member Modal ─────────────────────────────────────
  # Single-pick MultipleSelector per Phase 2 scope (UI-SPEC line 420 allows
  # multi-pick later). On confirm → CreateMembership → refresh both lists →
  # close + reset + toast.
  - id: add_member_modal
    type: Modal
    properties:
      visible: { _state: show_add_member_modal }
      title: הוספת חבר לצוות
      okText: הוסף
      cancelText: ביטול
      width: 480
    events:
      onOk:
        - id: validate_form
          type: Validate
          params: add_member_form
        - id: do_create
          type: Request
          params:
            requestId: create_membership_request
        - id: refresh_members_after_add
          type: Request
          params:
            requestId: list_team_members
        - id: refresh_addable_after_add
          type: Request
          params:
            requestId: list_addable_soldiers
        - id: close_add_modal
          type: SetState
          params:
            show_add_member_modal: false
        - id: reset_add_form
          type: Reset
          params: add_member_form
        - id: add_success_toast
          type: DisplayMessage
          params:
            status: success
            content: החייל נוסף לצוות
            duration: 3
      onCancel:
        - id: close_add_modal_cancel
          type: SetState
          params:
            show_add_member_modal: false
    blocks:
      - id: add_member_form
        type: Box
        blocks:
          - id: add_member_form.soldier_id
            type: Selector
            required: true
            properties:
              # i18n: team_detail.form.soldier
              label: חייל
              size: large
              options: { _request: list_addable_soldiers }
              allowClear: true

  # ───── Remove-member confirmation modal (Lowdefy 5.3 canonical ConfirmModal) ─────
  # Replaces the legacy inline `Confirm` action that does not exist in 5.3.
  # The destructive chain (remove_membership KnexRaw → audit write → refresh
  # both lists → toast) runs from onOk after the user confirms. Row context
  # (remove_target_membership_id, remove_target_display_name) is captured into
  # state by the grid's onCellClick → set_remove_target action before the
  # CallMethod toggleOpen fires.
  - id: remove_confirm_modal
    type: ConfirmModal
    properties:
      title: הסרת חבר מצוות
      content:
        _nunjucks:
          template: 'החייל "{{ name }}" יוסר מצוות זה. ניתן להוסיף אותו שוב מאוחר יותר.'
          on:
            name: { _state: remove_target_display_name }
      okText: הסר
      cancelText: ביטול
      okType: danger
    events:
      onOk:
        - id: do_remove
          type: Request
          params:
            requestId: remove_membership
        - id: do_audit_remove
          type: Request
          params:
            requestId: audit_remove_membership
        - id: refresh_members
          type: Request
          params:
            requestId: list_team_members
        - id: refresh_addable
          type: Request
          params:
            requestId: list_addable_soldiers
        - id: remove_toast
          type: DisplayMessage
          params:
            status: success
            content: החייל הוסר מהצוות
            duration: 3

  # ───────────────── Phase 03 plan 03-03 — Modals at page bottom ──────────────
  # 1) Shift-slot form Modal (UI-SPEC Surface 2) — branches onOk between
  #    CreateShiftSlot and UpdateShiftSlot based on shift_slot_form_mode state.
  # 2) Template wizard Modal (UI-SPEC Surface 3) — invokes ApplyShiftTemplate.
  # 3) Delete-confirmation Modal — wraps DeleteShiftSlot; catches the handler's
  #    'shift_slot_has_instances' error discriminator and surfaces a Hebrew toast.

  - id: shift_slot_form_modal
    type: Modal
    properties:
      visible: { _state: show_shift_slot_form_modal }
      # Modal title swaps Add/Edit based on form mode.
      title:
        _if:
          test: { _eq: [{ _state: shift_slot_form_mode }, edit] }
          then: עריכת משמרת
          else: הוספת משמרת לצוות
      okText: שמור משמרת
      cancelText: ביטול
      width: 560
    events:
      onOk:
        - id: validate_form
          type: Validate
          params: shift_slot_form
        # Branch: create vs edit. Lowdefy skip: gates allow exclusive dispatch.
        - id: do_create_slot
          type: Request
          skip: { _eq: [{ _state: shift_slot_form_mode }, edit] }
          params:
            requestId: create_shift_slot_request
        - id: do_update_slot
          type: Request
          skip: { _not: { _eq: [{ _state: shift_slot_form_mode }, edit] } }
          params:
            requestId: update_shift_slot_request
        - id: refresh_slots
          type: Request
          params:
            requestId: load_team_slots
        - id: close_shift_slot_form_modal
          type: SetState
          params:
            show_shift_slot_form_modal: false
        - id: reset_shift_slot_form
          type: Reset
          params: shift_slot_form
        - id: slot_save_toast
          type: DisplayMessage
          params:
            status: success
            content: המשמרת נשמרה
            duration: 3
      onCancel:
        - id: close_shift_slot_form_modal_cancel
          type: SetState
          params:
            show_shift_slot_form_modal: false
    blocks:
      - _ref:
          path: blocks/shift_slot_form.yaml

  - id: template_wizard_modal
    type: Modal
    properties:
      visible: { _state: show_template_wizard_modal }
      title: בחר תבנית משמרות לצוות
      # CTA label depends on selected_template (UI-SPEC Surface 3).
      okText:
        _if:
          test: { _eq: [{ _state: selected_template }, custom] }
          then: התחל ריק
          else: צור משמרות מתבנית
      cancelText: ביטול
      width: 720
    events:
      onOk:
        - id: do_apply_template
          type: Request
          params:
            requestId: apply_shift_template_request
        - id: refresh_slots_after_template
          type: Request
          params:
            requestId: load_team_slots
        - id: refresh_template_picked_at
          type: Request
          params:
            requestId: load_template_picked_at
        - id: close_template_wizard_modal
          type: SetState
          params:
            show_template_wizard_modal: false
        - id: template_applied_toast
          type: DisplayMessage
          params:
            status: success
            content: התבנית הוחלה בהצלחה
            duration: 3
      onCancel:
        - id: close_template_wizard_modal_cancel
          type: SetState
          params:
            show_template_wizard_modal: false
    blocks:
      - id: template_wizard_intro
        type: Paragraph
        properties:
          content: 'התבנית תיצור את המשמרות הבסיסיות. תוכל לערוך אותן בהמשך.'
      - _ref:
          path: blocks/template_wizard.yaml

  # Delete-confirmation modal — Lowdefy 5.3 canonical ConfirmModal.
  # If the handler throws 'shift_slot_has_instances', the request's `error.message`
  # carries that string; the failure toast keys on it to render the Hebrew message.
  - id: shift_slot_delete_confirm_modal
    type: ConfirmModal
    properties:
      title: מחיקת משמרת
      content:
        _nunjucks:
          template: 'המשמרת "{{ name }}" תימחק. פעולה זו לא ניתנת לביטול.'
          on:
            name: { _state: delete_target_shift_slot_name }
      okText: מחק
      cancelText: ביטול
      okType: danger
    events:
      onOk:
        - id: do_delete_slot
          type: Request
          params:
            requestId: delete_shift_slot_request
        - id: refresh_slots_after_delete
          type: Request
          params:
            requestId: load_team_slots
        - id: delete_success_toast
          type: DisplayMessage
          params:
            status: success
            content: המשמרת נמחקה
            duration: 3
      # If do_delete_slot fails (e.g., shift_slot_has_instances), Lowdefy surfaces
      # an error notification automatically. The handler's Error.message contains
      # 'shift_slot_has_instances' so the user sees an explicit refusal banner,
      # and the DB row remains intact.

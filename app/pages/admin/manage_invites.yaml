id: manage_invites
type: PageHeaderMenu
properties:
  title: 'ניהול קודי הזמנה | shifty'
requests:
  - id: list_org_units_for_select
    type: KnexRaw
    connectionId: shifts_db
    payload:
      tenant_id:
        _user: tenant_id
    properties:
      query: |
        SELECT id AS value, name AS label FROM org_unit
        WHERE tenant_id = :tenant_id
        ORDER BY level, name
      parameters:
        tenant_id: { _payload: tenant_id }

  - id: list_active_codes
    type: KnexRaw
    connectionId: shifts_db
    payload:
      tenant_id:
        _user: tenant_id
    properties:
      query: |
        SELECT ic.id, ic.code, ic.role, ou.name AS org_unit_name,
               ic.expires_at, ic.max_uses, ic.uses, ic.created_at
        FROM invite_code ic
        JOIN org_unit ou ON ou.id = ic.org_unit_id
        WHERE ic.tenant_id = :tenant_id
          AND ic.revoked_at IS NULL
          AND (ic.expires_at IS NULL OR ic.expires_at > now())
          AND (ic.max_uses IS NULL OR ic.uses < ic.max_uses)
        ORDER BY ic.created_at DESC
      parameters:
        tenant_id: { _payload: tenant_id }

  - id: create_invite
    type: KnexRaw
    connectionId: shifts_db
    # Note: request-level auth.roles not supported in Lowdefy 5.3.0; page-level auth.roles provides gate.
    payload:
      tenant_id:
        _user: tenant_id
      created_by:
        _user: user_id
      org_unit_id:
        _state: org_unit_select
      role:
        _state: role_select
      max_uses:
        _state: max_uses_input
      expires_at:
        _state: expires_at_input
    properties:
      query: |
        INSERT INTO invite_code (tenant_id, code, org_unit_id, role, max_uses, expires_at, created_by)
        SELECT
          :tenant_id,
          -- Generate 8-char Crockford base32 code (AUTH-04):
          -- Map 5 random bytes (40 bits) to 8 chars from the Crockford alphabet.
          -- translate() remaps standard base32 alphabet (ABCDEFGHIJKLMNOPQRSTUVWXYZ234567)
          -- to Crockford (0123456789ABCDEFGHJKMNPQRSTVWXYZ) — no I, L, O, U.
          translate(
            encode(gen_random_bytes(5), 'base32'),
            'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567',
            '0123456789ABCDEFGHJKMNPQRSTVWXYZ'
          ),
          :org_unit_id,
          :role,
          :max_uses,
          :expires_at,
          :created_by
        RETURNING id, code;
      parameters:
        tenant_id: { _payload: tenant_id }
        org_unit_id: { _payload: org_unit_id }
        role: { _payload: role }
        max_uses: { _payload: max_uses }
        expires_at: { _payload: expires_at }
        created_by: { _payload: created_by }

blocks:
  - id: title
    type: Title
    properties:
      content: ניהול קודי הזמנה
      level: 1
  - id: create_section
    type: Card
    properties:
      title: יצירת קוד חדש
    blocks:
      - id: org_unit_select
        type: Selector
        properties:
          label: יחידה ארגונית
          options:
            _request: list_org_units_for_select
      - id: role_select
        type: Selector
        properties:
          label: תפקיד
          options:
            - { value: unit_admin, label: מנהל מערך }
            - { value: team_manager, label: מנהל צוות }
            - { value: member, label: חבר }
            - { value: viewer, label: צופה }
      - id: max_uses_input
        type: NumberInput
        properties:
          label: 'מקסימום שימושים (ריק = ללא הגבלה)'
          min: 1
      - id: expires_at_input
        type: DateTimeSelector
        properties:
          label: 'תאריך תפוגה (ריק = ללא תפוגה)'
      - id: create_btn
        type: Button
        properties:
          title: צור קוד
        events:
          onClick:
            - { id: do_create, type: Request, params: { requestId: create_invite } }
            - { id: refresh, type: Request, params: { requestId: list_active_codes } }
  - id: existing_codes
    type: AgGridAlpine
    properties:
      rowData:
        _request: list_active_codes
      columnDefs:
        - { field: code, headerName: קוד }
        - { field: role, headerName: תפקיד }
        - { field: org_unit_name, headerName: יחידה }
        - { field: uses, headerName: 'שומש (פעמים)' }
        - { field: max_uses, headerName: מקסימום }
        - { field: expires_at, headerName: תפוגה }

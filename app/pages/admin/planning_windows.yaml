id: planning_windows
type: PageHeaderMenu
properties:
  title: 'חלונות תכנון | shifty'

# Plan 03-04 Task 2 — top-level index page for planning_window rows (UI-SPEC Surface 4).
#
# URL: /planning_windows (Lowdefy 5.3 routes pages by their YAML `id:` verbatim — the
# admin/ subdirectory is a filesystem-only organisation hint, not a URL prefix).
#
# Layout per UI-SPEC §"Surface 4":
#   1. Title 'חלונות תכנון'
#   2. Toolbar: [+ פתח חלון תכנון] + [team Selector filter]
#   3. AgGrid bound to load_planning_windows
#   4. Modal-wrapped pw_form_box block (Plan 03-04 reusable form)
#
# 4-layer tenant isolation:
#   Layer 1 (session):  tenant_id sourced from `_user: tenant_id` in every payload.
#   Layer 2 (query):    every KnexRaw / handler filters by WHERE tenant_id = :tenant_id
#                       and (for managers) AND (pw.team_id = ANY(:team_ids) OR is_admin).
#   Layer 3 (page):     auth.roles allowlist in lowdefy.yaml — soldier/viewer denied here.
#   Layer 4 (handler):  OpenPlanningWindow / EditPlanningWindow / DeletePlanningWindow
#                       enforce membership-join scope check; tenant_id always from session.
#   Layer 5 (RLS):      0009 + 0014 RLS policies on planning_window + shift_instance.

requests:
  # ── load_planning_windows ───────────────────────────────────────────────────
  # Lists planning_window rows visible to the caller, filtered by:
  #   - tenant_id (always)
  #   - role: admins see all teams; managers see only their team_ids.
  # Joined with org_unit so the grid can render the Hebrew team name.
  - id: load_planning_windows
    type: KnexRawTenant
    connectionId: shifts_db
    payload:
      tenant_id:
        _user: tenant_id
      team_ids:
        _user: team_ids
      is_admin:
        _array.includes:
          on: { _user: roles }
          value: unit_admin
    properties:
      query: |
        SELECT pw.id,
               pw.team_id,
               ou.name AS team_name,
               pw.start_date,
               pw.end_date,
               pw.constraint_lock_at,
               pw.state,
               (SELECT COUNT(*) FROM shift_instance si
                 WHERE si.planning_window_id = pw.id
                   AND si.tenant_id = pw.tenant_id) AS instance_count
          FROM planning_window pw
          JOIN org_unit ou
            ON ou.id = pw.team_id
           AND ou.tenant_id = pw.tenant_id
         WHERE pw.tenant_id = :tenant_id
           AND (:is_admin OR pw.team_id = ANY(:team_ids))
         ORDER BY pw.state, pw.start_date DESC
      parameters:
        tenant_id: { _payload: tenant_id }
        team_ids: { _payload: team_ids }
        is_admin: { _payload: is_admin }

  # ── list_teams_for_pw ───────────────────────────────────────────────────────
  # Options for the planning_window_open_form's team Selector. Same role-gated
  # scope as load_planning_windows: admins see every team in the tenant; managers
  # see only their team_ids. Excludes the root org_unit (level=1) since planning
  # windows must target a leaf team.
  - id: list_teams_for_pw
    type: KnexRawTenant
    connectionId: shifts_db
    payload:
      tenant_id:
        _user: tenant_id
      team_ids:
        _user: team_ids
      is_admin:
        _array.includes:
          on: { _user: roles }
          value: unit_admin
    properties:
      query: |
        SELECT id AS value, name AS label
          FROM org_unit
         WHERE tenant_id = :tenant_id
           AND level > 1
           AND (:is_admin OR id = ANY(:team_ids))
         ORDER BY name
      parameters:
        tenant_id: { _payload: tenant_id }
        team_ids: { _payload: team_ids }
        is_admin: { _payload: is_admin }

  # ── load_team_slot_count ────────────────────────────────────────────────────
  # Used by the form's live preview + the "team has zero slots" Alert. Reactive
  # on pw_form.team_id state — refreshed by the form's onChange in the Modal.
  - id: load_team_slot_count
    type: KnexRawTenant
    connectionId: shifts_db
    payload:
      tenant_id:
        _user: tenant_id
      team_id:
        _state: pw_form.team_id
    properties:
      query: |
        SELECT COUNT(*)::int AS c
          FROM shift_slot
         WHERE tenant_id = :tenant_id
           AND team_id = COALESCE(:team_id::uuid, '00000000-0000-0000-0000-000000000000'::uuid)
      parameters:
        tenant_id: { _payload: tenant_id }
        team_id: { _payload: team_id }

  # ── open_planning_window_request ────────────────────────────────────────────
  # Fires the OpenPlanningWindow custom handler. tenant_id derived inside the
  # handler from request.user (session) — payload fields below are the user-
  # picked form values + the team_id selected in the Modal.
  - id: open_planning_window_request
    type: OpenPlanningWindow
    connectionId: shifts_db
    payload:
      team_id: { _state: pw_form.team_id }
      start_date: { _state: pw_form.start_date }
      end_date: { _state: pw_form.end_date }
      constraint_lock_at: { _state: pw_form.constraint_lock_at }

blocks:
  - id: page_title
    type: Title
    properties:
      content: חלונות תכנון
      level: 1

  # ── Toolbar ────────────────────────────────────────────────────────────────
  - id: planning_windows_toolbar
    type: Flex
    properties:
      gap: small
      justify: flex-start
      align: center
      style:
        marginBottom: 12
    blocks:
      - id: open_window_btn
        type: Button
        properties:
          # i18n: planning_windows.toolbar.open
          title: '+ פתח חלון תכנון'
          type: primary
          icon: AiOutlinePlus
        events:
          onClick:
            - id: reset_pw_form_before_open
              type: Reset
              params: pw_form_box
            - id: open_pw_modal
              type: SetState
              params:
                show_open_pw_modal: true

  # ── AgGrid: planning_window rows ────────────────────────────────────────────
  # Columns per UI-SPEC Surface 4: צוות | טווח | נעילה | מצב | משמרות
  # Row click → navigate to /planning_window_detail?id={row.id} (Plan 03-07).
  - id: planning_windows_grid
    type: AgGridAlpine
    properties:
      pagination: false
      rowData: { _request: load_planning_windows }
      defaultColDef:
        sortable: true
        resizable: true
        filter: true
        flex: 1
      columnDefs:
        - field: team_name
          headerName: צוות
          flex: 2
        - field: start_date
          headerName: טווח
          flex: 2
          cellRenderer:
            _function:
              __args: 0
              __return:
                _nunjucks:
                  template: '{{ s | date("DD/MM/YYYY") }} – {{ e | date("DD/MM/YYYY") }}'
                  on:
                    s: { __args: 0.data.start_date }
                    e: { __args: 0.data.end_date }
        - field: constraint_lock_at
          headerName: נעילה
          flex: 2
          cellRenderer:
            _function:
              __args: 0
              __return:
                _nunjucks:
                  template: '{{ value | date("DD/MM HH:mm") }}'
                  on:
                    value: { __args: 0.value }
        - field: state
          headerName: מצב
          width: 110
          cellRenderer:
            _function:
              __args: 0
              __return:
                _nunjucks:
                  template: |
                    {% if value == 'open' %}<span style="color:#1890FF">פתוח</span>{% elif value == 'draft' %}<span style="color:#FA8C16">טיוטה</span>{% elif value == 'published' %}<span style="color:#52C41A">פורסם</span>{% else %}<span style="color:#8C8C8C">סגור</span>{% endif %}
                  on:
                    value: { __args: 0.value }
        - field: instance_count
          headerName: משמרות
          width: 110
          type: numericColumn
    events:
      # Row click → navigate to the (yet-to-be-built) planning_window_detail
      # page (Plan 03-07 wires it). For Plan 03-04 the click target exists but
      # 404s gracefully until 03-07 lands — same forward-reference pattern as
      # team_detail's Phase 3 surfaces.
      onCellClick:
        - id: open_detail
          type: Link
          params:
            pageId: planning_window_detail
            urlQuery:
              id: { _event: row.id }

  # ── Empty state ─────────────────────────────────────────────────────────────
  - id: planning_windows_empty_state
    type: Result
    visible:
      _eq:
        - { _request: load_planning_windows.length }
        - 0
    properties:
      status: info
      icon: AiOutlineCalendar
      # i18n: planning_windows.empty_title
      title: אין חלונות תכנון
      # i18n: planning_windows.empty_subtitle
      subTitle: פתח חלון תכנון חדש כדי להתחיל בתכנון משמרות

  # ── Open-window Modal ────────────────────────────────────────────────────────
  # Wraps the planning_window_open_form block. Modal okText is the submit
  # affordance. Modal onOk validates the form, fires open_planning_window_request,
  # refreshes the grid, closes the modal, resets the form, and shows a toast.
  #
  # Modal okButtonProps.disabled is computed from the form state:
  #   - team_id missing            → disabled
  #   - start/end missing          → disabled
  #   - load_team_slot_count == 0  → disabled (no slots → handler would refuse)
  #   - end < start                → disabled
  - id: open_pw_modal
    type: Modal
    properties:
      visible: { _state: show_open_pw_modal }
      title: פתיחת חלון תכנון
      okText: פתח חלון
      cancelText: ביטול
      width: 640
      okButtonProps:
        disabled:
          _or:
            - _not: { _state: pw_form.team_id }
            - _not: { _state: pw_form.start_date }
            - _not: { _state: pw_form.end_date }
            - { _eq: [{ _request: load_team_slot_count.0.c }, 0] }
            - _lt:
                - { _state: pw_form.end_date }
                - { _state: pw_form.start_date }
    events:
      onOk:
        - id: validate_pw_form
          type: Validate
          params: pw_form_box
        - id: do_open_pw
          type: Request
          params:
            requestId: open_planning_window_request
        - id: refresh_windows_after_open
          type: Request
          params:
            requestId: load_planning_windows
        - id: close_pw_modal_after_open
          type: SetState
          params:
            show_open_pw_modal: false
        - id: reset_pw_form_after_open
          type: Reset
          params: pw_form_box
        - id: pw_opened_toast
          type: DisplayMessage
          params:
            status: success
            content: חלון התכנון נפתח
            duration: 3
      onCancel:
        - id: close_pw_modal_cancel
          type: SetState
          params:
            show_open_pw_modal: false
    blocks:
      - _ref:
          path: blocks/planning_window_open_form.yaml

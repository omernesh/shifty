id: my_profile
type: PageHeaderMenu
properties:
  title: 'הפרופיל שלי | shifty'

# Plan 02-07 Task 3 — minimal soldier-facing color override (D-16).
#
# Path: app/pages/my_profile.yaml (NOT under /admin/ — every authenticated role
# can reach this page). All four Phase-2 roles are listed explicitly so the page
# matches PATTERNS.md analog `app/pages/dashboards/my_dashboard.yaml` (lines 1-9).
#
# Scope: Phase 2 ships ONLY the color picker. Phone/locale/notification
# preferences are deferred to Phase 6/7 per CONTEXT D-16 ("Phase 2 ships a
# minimal my_profile page with color override"). The Phase 6/7 placeholder card
# at the bottom communicates this to users explicitly.
#
# 4-layer tenant isolation:
#   Layer 1 (session):  every payload sets user_id AND tenant_id from `_user`.
#   Layer 2 (query):    WHERE user_id = :user_id AND tenant_id = :tenant_id —
#                       both flow from session; clients cannot update another
#                       user's row (T-02-06 mitigation).
#   Layer 3 (page):     auth.roles allowlist above (every authenticated role).
#   Layer 4:            n/a — no plugin handler; UPDATE is direct KnexRaw.
#                       Defense lives entirely in the WHERE clause.
#   Layer 5 (RLS):      0009 policy on soldier covers DB-level cross-tenant.

requests:
  # ── Load the caller's own soldier row (color only) ─────────────────────────
  # Soldier-row lookup keyed by app_user.id. CreateSoldier (plan 02-06) wires
  # soldier.user_id = app_user.id at create time; signup_with_invite (Phase 1
  # D-08) also writes both. If the user signed up via Phase 1 founding-admin
  # self-signup but the soldier row was never created, this returns 0 rows —
  # the empty-state Result below covers that case.
  - id: load_my_soldier
    type: KnexRaw
    connectionId: shifts_db
    payload:
      user_id:
        _user: user_id
      tenant_id:
        _user: tenant_id
    properties:
      query: |
        SELECT id,
               display_name,
               color
          FROM soldier
         WHERE user_id = :user_id
           AND tenant_id = :tenant_id
      parameters:
        user_id: { _payload: user_id }
        tenant_id: { _payload: tenant_id }

  # ── update_my_color — caller updates ONLY their own soldier row's color ────
  # T-02-06 (Privilege escalation via my_profile) mitigation: BOTH user_id and
  # tenant_id flow from _user (session) — NEVER from _state or _input. The
  # WHERE clause hard-binds to the caller's own soldier row, so a forged
  # request body cannot update any soldier but the caller's own.
  # The color hex value comes from the shared color_swatches block's
  # selected_color_hex state slot (D-16 / plan 02-06 shared block contract).
  - id: update_my_color
    type: KnexRaw
    connectionId: shifts_db
    payload:
      user_id: { _user: user_id }
      tenant_id: { _user: tenant_id }
      color: { _state: selected_color_hex }
    properties:
      query: |
        UPDATE soldier
           SET color = :color,
               updated_at = now()
         WHERE user_id = :user_id
           AND tenant_id = :tenant_id
         RETURNING id, color
      parameters:
        user_id: { _payload: user_id }
        tenant_id: { _payload: tenant_id }
        color: { _payload: color }

blocks:
  - id: page_title
    type: Title
    properties:
      # i18n: profile.title
      content: הפרופיל שלי
      level: 1

  # ─────────────────────── Card: צבע אישי ────────────────────────────────
  # _ref's the shared 24-swatch block emitted by tools/gen-color-swatches.mjs.
  # Resolution from app/pages/my_profile.yaml up one level to app/blocks/ — see
  # PATTERNS.md analog block listing line 50 (`app/blocks/color_swatches.yaml`).
  # The swatch grid reads/writes _state.selected_color_index +
  # _state.selected_color_hex per block's documented contract.
  - id: card_color
    type: Card
    properties:
      title: צבע אישי
      # L-3 (round 2): headStyle removed — silently dropped in 5.3. RTL header from dir="rtl".
      style:
        marginBottom: 24
    blocks:
      - id: color_intro
        type: Paragraph
        properties:
          # i18n: profile.color_intro
          content: 'הצבע שלך מופיע בלוח המשמרות. בחר צבע מהפלטה שלמטה.'

      - _ref: blocks/color_swatches.yaml

      - id: save_color_btn
        type: Button
        properties:
          # i18n: profile.save_color
          title: שמור צבע
          type: primary
          icon: AiOutlineSave
          style:
            marginTop: 16
        events:
          onClick:
            - id: do_update_color
              type: Request
              params:
                requestId: update_my_color
            - id: refresh_my_soldier
              type: Request
              params:
                requestId: load_my_soldier
            - id: color_saved_toast
              type: DisplayMessage
              params:
                status: success
                content: הצבע עודכן
                duration: 3

  # ── Empty-state Result (no soldier row found for this user) ───────────────
  # Covers the edge case from CreateSoldier docstring above: a user who signed
  # up via founding-admin path but has no soldier row yet. The picker is still
  # functional because color_swatches writes to local state; the UPDATE simply
  # affects zero rows (RETURNING is empty) until a soldier row exists.
  - id: no_soldier_state
    type: Result
    visible:
      _eq:
        - { _request: load_my_soldier.length }
        - 0
    properties:
      status: info
      icon: AiOutlineInbox
      # i18n: profile.empty_title
      title: בחר את הצבע שלך
      # i18n: profile.empty_subtitle
      subTitle: הצבע יופיע בלוח המשמרות שלך

  # ── Phase 6/7 placeholder Card per UI-SPEC §"Page 7" last block ───────────
  # Promises future profile fields (phone, locale, notification prefs).
  - id: phase_6_7_placeholder
    type: Result
    properties:
      status: info
      icon: AiOutlineClockCircle
      # i18n: profile.phase_6_7_placeholder_title
      title: עוד הגדרות פרופיל יתווספו בשלבים הבאים
      subTitle: טלפון, שפה והעדפות התראה יתווספו בהדרגה.

lowdefy: 5.3.0
name: shifty
license: Apache-2.0

plugins:
  - name: '@lowdefy/connection-knex'
    version: '5.3.0'
  - name: '@lowdefy/blocks-aggrid'
    version: '5.3.0'
  - name: 'shifty-audit-writer'
    version: 'workspace:*'

connections:
  - id: shifts_db
    type: Knex
    properties:
      client: pg
      connection:
        connectionString:
          _secret: POSTGRES_CONNECTION_STRING

menus:
  - id: default
    links:
      - id: home_link
        type: MenuLink
        pageId: home
        properties:
          title: Home
      - id: employees_link
        type: MenuLink
        pageId: employees
        properties:
          title: Employees

pages:
  - id: home
    type: PageHeaderMenu
    properties:
      title: shifty
    blocks:
      - id: welcome
        type: Title
        properties:
          content: shifty
          level: 1
      - id: subtitle
        type: Paragraph
        properties:
          content: Shifts management. Schema is deployed; the app is being built.

  - id: employees
    type: PageHeaderMenu
    properties:
      title: Employees | shifty
    requests:
      - id: list_employees
        type: KnexRaw
        connectionId: shifts_db
        properties:
          query: |
            -- @gsd-allow-untenanted: bootstrap smoke-test surface; legacy 0001 table; superseded in Phase 2
            SELECT id, name, email, role, employment_type, hourly_rate, max_weekly_hrs, active
            FROM employees
            ORDER BY name;
    blocks:
      - id: header
        type: Title
        properties:
          content: Employees
          level: 1
      - id: count
        type: Paragraph
        properties:
          content:
            _nunjucks:
              template: '{{ rows | length }} employee(s)'
              on:
                rows:
                  _request: list_employees
      - id: employee_table
        type: AgGridAlpine
        properties:
          rowData:
            _request: list_employees
          defaultColDef:
            sortable: true
            resizable: true
          columnDefs:
            - field: name
              headerName: Name
            - field: email
              headerName: Email
            - field: role
              headerName: Role
            - field: employment_type
              headerName: Type
            - field: hourly_rate
              headerName: Hourly Rate
            - field: max_weekly_hrs
              headerName: Max Hrs/Week
            - field: active
              headerName: Active

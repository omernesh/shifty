lowdefy: 5.3.0
name: shifty
license: Apache-2.0

plugins:
  - name: '@lowdefy/connection-knex'
    version: '5.3.0'
  - name: '@lowdefy/blocks-aggrid'
    version: '5.3.0'
  - name: '@lowdefy/blocks-antd'
    version: '5.3.0'
  - name: '@lowdefy/blocks-loaders'
    version: '5.3.0'
  - name: '@lowdefy/plugin-next-auth'
    version: '5.3.0'
  - name: 'shifty-plugin'
    version: 'file:../../plugins/shifty-plugin'

connections:
  - _ref: connections/shifts_db.yaml

auth:
  pages:
    protected: true
    public:
      - login
      - signup
      - signup_with_invite
      - '404'
    roles:
      unit_admin:
        - admin_dashboard
        - admin_test_audit
        - manage_invites
        - manage_org_units
        - manage_soldiers
        - manage_role_tags
        - soldier_detail
        - team_detail
        - roster_import
        - roster_import_result
        - planning_windows
        - my_profile
        - manager_dashboard
        - my_dashboard
        - my_availability
      team_manager:
        - manage_org_units
        - manage_soldiers
        - soldier_detail
        - team_detail
        - roster_import
        - roster_import_result
        - planning_windows
        - my_profile
        - manager_dashboard
        - my_dashboard
        - my_availability
      member:
        - my_profile
        - my_dashboard
        - my_availability
      viewer:
        - my_profile
        - my_dashboard
  authPages:
    signIn: /login
  providers:
    - id: email
      type: EmailProvider
      properties:
        server:
          host: smtp.resend.com
          port: 465
          auth:
            user: resend
            pass:
              _secret: RESEND_API_KEY
        from:
          _secret: RESEND_FROM_EMAIL
        maxAge: 1800
  adapter:
    id: knex_adapter
    type: KnexAdapter
    properties:
      connectionId: shifts_db
  session:
    strategy: database
    maxAge: 2592000
  callbacks:
    - id: shifty_session
      type: ShiftySessionCallback

menus:
  - id: default
    links:
      - id: home_link
        type: MenuLink
        pageId: home
        properties:
          title: Home
      - id: admin_dashboard_link
        type: MenuLink
        pageId: admin_dashboard
        properties:
          title: לוח בקרה
        visible:
          _user: tenant_id
      - id: manage_invites_link
        type: MenuLink
        pageId: manage_invites
        properties:
          title: קודי הזמנה
        visible:
          _user: tenant_id
      - id: manage_org_units_link
        type: MenuLink
        pageId: manage_org_units
        properties:
          title: יחידות ארגוניות
        visible:
          _user: tenant_id
      - id: manage_soldiers_link
        type: MenuLink
        pageId: manage_soldiers
        properties:
          title: חיילים
        visible:
          _user: tenant_id
      - id: roster_import_link
        type: MenuLink
        pageId: roster_import
        properties:
          title: ייבוא חיילים
        visible:
          _user: tenant_id
      # Plan 03-04: planning_window index page. Visible to unit_admin + team_manager
      # via _array.includes on _user:roles (soldier + viewer roles do not see it).
      - id: planning_windows_link
        type: MenuLink
        pageId: planning_windows
        properties:
          title: חלונות תכנון
        visible:
          _or:
            - _array.includes:
                on: { _user: roles }
                value: unit_admin
            - _array.includes:
                on: { _user: roles }
                value: team_manager
      - id: manage_role_tags_link
        type: MenuLink
        pageId: manage_role_tags
        properties:
          title: תגיות תפקיד
        visible:
          _user: tenant_id
      - id: my_profile_link
        type: MenuLink
        pageId: my_profile
        properties:
          title: הפרופיל שלי
        visible:
          _user: tenant_id
      - id: my_dashboard_link
        type: MenuLink
        pageId: my_dashboard
        properties:
          title: הדף שלי
        visible:
          _user: tenant_id

pages:
  - id: home
    type: PageHeaderMenu
    properties:
      title: shifty
    blocks:
      - id: welcome
        type: Title
        properties:
          content: shifty
          level: 1
      - id: subtitle
        type: Paragraph
        properties:
          content: Shifts management. Schema is deployed; the app is being built.

  - _ref: pages/auth/login.yaml
  - _ref: pages/auth/signup.yaml
  - _ref: pages/auth/signup_with_invite.yaml
  - _ref: pages/admin/admin_dashboard.yaml
  - _ref: pages/admin/manage_invites.yaml
  - _ref: pages/admin/admin_test_audit.yaml
  - _ref: pages/admin/manage_org_units.yaml
  - _ref: pages/admin/manage_soldiers.yaml
  - _ref: pages/admin/soldier_detail.yaml
  - _ref: pages/admin/team_detail.yaml
  - _ref: pages/admin/roster_import.yaml
  - _ref: pages/admin/roster_import_result.yaml
  - _ref: pages/admin/manage_role_tags.yaml
  - _ref: pages/admin/planning_windows.yaml
  - _ref: pages/my_profile.yaml
  - _ref: pages/dashboards/my_dashboard.yaml
  - _ref: pages/dashboards/manager_dashboard.yaml
  # Plan 03-05 — soldier-facing availability declaration page (UI-SPEC Surface 8).
  # Parameterized via ?planning_window_id=<uuid>&soldier_id=<uuid?>.
  # No top-level menu link — reached from my_dashboard / planning_windows surfaces.
  - _ref: pages/my_availability.yaml

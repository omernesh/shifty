# app/blocks/template_wizard.yaml
# Reusable template wizard cards (UI-SPEC Surface 3 — Phase 03 plan 03-03).
#
# _ref'd from team_detail.yaml — the parent wraps this Flex inside a Modal whose
# onOk fires the ApplyShiftTemplate request, passing template_key from
# `_state.selected_template`.
#
# State contract (parent-managed):
#   writes  selected_template   one of '2x12h' | '3x8h' | 'custom'
#
# The CTA button is owned by the parent Modal (UI-SPEC Surface 3 footer); its
# okText swaps between 'צור משמרות מתבנית' (for 2x12h/3x8h) and 'התחל ריק'
# (for the custom card). The cards in this block only update selected_template
# in state — they never trigger ApplyShiftTemplate directly.
#
# Hebrew slot names are BYTE-EXACT from PRD §7.4 + CONTEXT D-Area-1 specifics:
#   2x12h: בוקר 06:00–18:00, לילה 18:00–06:00
#   3x8h:  בוקר 06:00–14:00, ערב 14:00–22:00, לילה 22:00–06:00
#   custom: ללא משמרות מוגדרות / הוסף משמרת בודדת
id: template_wizard
type: Flex
properties:
  gap: middle
  wrap: wrap
  justify: center
  align: stretch
style:
  marginTop: 12
blocks:
  # ── 2x12h card ────────────────────────────────────────────────────────────
  - id: template_wizard.card_2x12h
    type: Box
    style:
      cursor: pointer
      padding: 16
      borderRadius: 8
      border:
        _if:
          test: { _eq: [{ _state: selected_template }, '2x12h'] }
          then: '2px solid #1677FF'
          else: '1px solid #D9D9D9'
      backgroundColor:
        _if:
          test: { _eq: [{ _state: selected_template }, '2x12h'] }
          then: '#E6F4FF'
          else: '#FFFFFF'
      width: 200
      minHeight: 180
    events:
      onClick:
        - id: pick_2x12h
          type: SetState
          params:
            selected_template: '2x12h'
    blocks:
      - id: template_wizard.card_2x12h.title
        type: Title
        properties:
          level: 4
          content: '2x12h'
      - id: template_wizard.card_2x12h.slot_1
        type: Paragraph
        properties:
          content: 'בוקר 06:00–18:00'
      - id: template_wizard.card_2x12h.slot_2
        type: Paragraph
        properties:
          content: 'לילה 18:00–06:00'

  # ── 3x8h card ─────────────────────────────────────────────────────────────
  - id: template_wizard.card_3x8h
    type: Box
    style:
      cursor: pointer
      padding: 16
      borderRadius: 8
      border:
        _if:
          test: { _eq: [{ _state: selected_template }, '3x8h'] }
          then: '2px solid #1677FF'
          else: '1px solid #D9D9D9'
      backgroundColor:
        _if:
          test: { _eq: [{ _state: selected_template }, '3x8h'] }
          then: '#E6F4FF'
          else: '#FFFFFF'
      width: 200
      minHeight: 180
    events:
      onClick:
        - id: pick_3x8h
          type: SetState
          params:
            selected_template: '3x8h'
    blocks:
      - id: template_wizard.card_3x8h.title
        type: Title
        properties:
          level: 4
          content: '3x8h'
      - id: template_wizard.card_3x8h.slot_1
        type: Paragraph
        properties:
          content: 'בוקר 06:00–14:00'
      - id: template_wizard.card_3x8h.slot_2
        type: Paragraph
        properties:
          content: 'ערב 14:00–22:00'
      - id: template_wizard.card_3x8h.slot_3
        type: Paragraph
        properties:
          content: 'לילה 22:00–06:00'

  # ── custom card ───────────────────────────────────────────────────────────
  - id: template_wizard.card_custom
    type: Box
    style:
      cursor: pointer
      padding: 16
      borderRadius: 8
      border:
        _if:
          test: { _eq: [{ _state: selected_template }, custom] }
          then: '2px solid #1677FF'
          else: '1px solid #D9D9D9'
      backgroundColor:
        _if:
          test: { _eq: [{ _state: selected_template }, custom] }
          then: '#E6F4FF'
          else: '#FFFFFF'
      width: 200
      minHeight: 180
    events:
      onClick:
        - id: pick_custom
          type: SetState
          params:
            selected_template: custom
    blocks:
      - id: template_wizard.card_custom.title
        type: Title
        properties:
          level: 4
          content: 'Custom'
      - id: template_wizard.card_custom.body_1
        type: Paragraph
        properties:
          content: 'ללא משמרות מוגדרות'
      - id: template_wizard.card_custom.body_2
        type: Paragraph
        properties:
          content: 'הוסף משמרת בודדת'

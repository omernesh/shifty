services:
  # ============================================================================
  # Shifty Postgres — source of truth for tenancy, roster, shifts, assignments,
  # availability, audit. Migrations 0001–0014 are applied; Layer-5 RLS is
  # active (FORCE ROW LEVEL SECURITY on every domain table; `shifty_app` role).
  #
  # The app tier (Next.js 15 + Auth.js + Drizzle) will be added in a follow-up
  # step. For now this compose only stands up Postgres + the one-shot migrate
  # runner so the schema can be applied / inspected locally and on hpg5.
  # ============================================================================

  migrate:
    image: migrate/migrate:v4.18.3
    container_name: shifty-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      # Connect as `migrator` (dedicated SUPERUSER). The app role `shifts` is NOSUPERUSER
      # so it cannot bypass RLS via `SET row_security = off`. See `docs/OPERATIONS.md`
      # § "Postgres role split" for the rationale and the rollback recipe.
      - "-database=postgres://migrator:${MIGRATOR_PASSWORD:?missing}@postgres:5432/${POSTGRES_DB:-shifts}?sslmode=disable"
      - "up"
    restart: "no"
    # One-shot: exits 0 on success. Run manually before each deploy:
    #   docker compose run --rm migrate
    # Note: 'up' is already included in the command above; do not append it to the run command.

  postgres:
    image: postgres:16
    container_name: shifts-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shifts}
      POSTGRES_USER: ${POSTGRES_USER:-shifts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./db/migrations:/migrations:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shifts} -d ${POSTGRES_DB:-shifts}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No host port exposed — internal docker network only.
    # The Next.js app (added later) will reach it at host=postgres, port=5432.

  # solver:  # Phase 4 — FastAPI CP-SAT solver service; internal-only port; auth via Bearer SOLVER_SHARED_SECRET
  #   build: ./solver
  #   environment:
  #     SOLVER_SHARED_SECRET: ${SOLVER_SHARED_SECRET:?missing}
  #   restart: unless-stopped


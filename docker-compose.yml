services:
  lowdefy:
    build: ./app
    container_name: shifty-lowdefy
    ports:
      - "8080:3000"
    environment:
      POSTGRES_CONNECTION_STRING: "postgresql://${POSTGRES_USER:-shifts}:${POSTGRES_PASSWORD:?missing}@postgres:5432/${POSTGRES_DB:-shifts}"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?missing}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://apps.nesher.co}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:16
    container_name: shifts-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shifts}
      POSTGRES_USER: ${POSTGRES_USER:-shifts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./db/migrations:/migrations:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shifts} -d ${POSTGRES_DB:-shifts}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No host port exposed — internal docker network only.
    # Lowdefy reaches it at host=postgres, port=5432.

services:
  appsmith:
    image: appsmith/appsmith-ce:latest
    container_name: shifts-appsmith
    ports:
      - "8080:80"
    volumes:
      - ./appsmith-stacks:/appsmith-stacks
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  postgres:
    image: postgres:16
    container_name: shifts-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shifts}
      POSTGRES_USER: ${POSTGRES_USER:-shifts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./db/migrations:/migrations:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shifts} -d ${POSTGRES_DB:-shifts}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No `ports:` exposed — postgres is reachable only via the docker network.
    # Appsmith connects at host=postgres, port=5432.
